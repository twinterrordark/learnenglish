<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>A2 İngilizce Gramer Haritası</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#f0f2f8; --text:#1b1f2e; --muted:#6b7280;
  --line:#e3e6ef; --accent:#4f46e5; --accent-soft:#eef0ff; --accent-2:#0d9488;
  --ok:#16a34a; --ok-soft:#e8f7ee; --warn:#d97706; --warn-soft:#fdf3e3; --err:#dc2626; --err-soft:#fdecec;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --nav-w:300px;
}
html[data-theme="dark"]{
  --bg:#0f1117; --surface:#171a23; --surface2:#1e222d; --text:#e8eaf2; --muted:#9aa1b1;
  --line:#2a2f3d; --accent:#8b8cf7; --accent-soft:#242642; --accent-2:#2dd4bf;
  --ok:#4ade80; --ok-soft:#16281d; --warn:#fbbf24; --warn-soft:#2b2214; --err:#f87171; --err-soft:#2c1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;
}
html.nav-open, html.nav-open body{overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:16px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--surface2);border:1px solid var(--line);transition:.15s}
.icon-btn:active{transform:scale(.93)}
#menuBtn{display:none}

/* ---------- LAYOUT ---------- */
.wrap{display:flex;align-items:flex-start;max-width:1280px;margin:0 auto}
nav{
  width:var(--nav-w);flex:none;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto;
  padding:16px 10px 40px;border-right:1px solid var(--line);
}
main{flex:1;min-width:0;padding:18px 16px 90px}

/* ---------- SEARCH ---------- */
.search-box{position:relative;margin-bottom:14px}
.search-box input{
  width:100%;padding:11px 12px 11px 36px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:.15s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-box::before{content:"⌕";position:absolute;left:12px;top:8px;font-size:19px;color:var(--muted)}

/* ---------- PROGRESS ---------- */
.prog-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:600}
.prog-bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .4s}

/* ---------- NAV LIST ---------- */
.node-group{margin-bottom:16px}
.node-head{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.node-num{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:11px;flex:none}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:10px;
  font-size:14.5px;color:var(--text);transition:.13s;margin-bottom:1px}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-item .dot{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none;transition:.2s}
.nav-item.done .dot{background:var(--ok)}
.nav-item span{flex:1;min-width:0}
.nav-special{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;
  border-radius:11px;padding:11px 13px;width:100%;text-align:left;margin-bottom:10px;font-size:14.5px}

/* ---------- CONTENT ---------- */
.crumb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin-bottom:6px}
h1.topic-title{font-size:clamp(22px,5.5vw,30px);line-height:1.25;margin:0 0 6px;letter-spacing:-.6px;font-weight:800}
.topic-sub{color:var(--muted);font-size:15px;margin:0 0 18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.card h3 .ico{font-size:16px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 4px;padding-left:20px}
.card li{margin-bottom:5px}
b,strong{font-weight:700}
code,.k{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;font-weight:600}

.formula{background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px dashed var(--accent);
  border-radius:11px;padding:12px 14px;font-weight:700;text-align:center;margin:0 0 12px;font-size:15px;
  overflow-x:auto;white-space:nowrap}
.formula:last-child{margin-bottom:0}

.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:11px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th{background:var(--surface2);text-align:left;padding:10px 12px;font-weight:700;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr td:first-child{font-weight:600}

.ex{border-left:3px solid var(--accent-2);padding:8px 0 8px 12px;margin-bottom:11px}
.ex:last-child{margin-bottom:0}
.ex .en{font-weight:600;margin-bottom:2px}
.ex .tr{color:var(--muted);font-size:14.5px}
.hl{background:linear-gradient(transparent 58%,rgba(13,148,136,.28) 58%);font-weight:800;padding:0 1px}

.note{border-radius:11px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;border:1px solid}
.note:last-child{margin-bottom:0}
.note b.lbl{display:block;margin-bottom:3px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.note.tip{background:var(--ok-soft);border-color:transparent;color:var(--text)}
.note.tip b.lbl{color:var(--ok)}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.warn b.lbl{color:var(--warn)}
.note.err{background:var(--err-soft);border-color:transparent}
.note.err b.lbl{color:var(--err)}

/* ---------- QUIZ ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.q-num{font-size:11.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.q-text{font-weight:600;margin-bottom:12px;font-size:15.5px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
  margin-bottom:8px;background:var(--surface);transition:.15s;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.q-exp{display:none;margin-top:6px;padding:11px 13px;border-radius:10px;background:var(--surface2);font-size:14.5px}
.q-exp.show{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:11px;
  font-weight:700;font-size:15px;transition:.15s;border:1px solid var(--line);background:var(--surface)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.done-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- HOME ---------- */
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:18px;
  padding:26px 22px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(23px,6vw,32px);letter-spacing:-.7px;line-height:1.2}
.hero p{margin:0;opacity:.92;font-size:15px;max-width:52ch}
.node-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.node-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);text-align:left;width:100%;transition:.15s}
.node-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.node-card h4{margin:8px 0 5px;font-size:16px;font-weight:800;letter-spacing:-.3px}
.node-card p{margin:0;color:var(--muted);font-size:14px}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:99px;letter-spacing:.5px}

.res-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;margin-bottom:8px}
.res-item:hover{border-color:var(--accent)}
.res-item .t{font-weight:700}
.res-item .n{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* ---------- SCORE ---------- */
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.score .big{font-size:clamp(22px,6vw,36px);font-weight:800;letter-spacing:-1px;line-height:1.2;word-break:break-word}

.backdrop{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  background:rgba(0,0,0,.5);z-index:900;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-tap-highlight-color:transparent;
}
.backdrop.show{display:block}
.nav-drawer-hdr{display:none}

/* ---------- RESPONSIVE / MOBILE ---------- */
@media(max-width:900px){
  #menuBtn{display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .wrap{display:block;width:100%;max-width:100%}
  .nav-drawer-hdr{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);
  }
  nav{
    position:fixed;top:0;left:0;bottom:0;height:100%;height:100dvh;width:min(85vw,320px);
    z-index:1000;background:var(--surface);
    transform:translate3d(-105%,0,0);-webkit-transform:translate3d(-105%,0,0);
    transition:transform .25s cubic-bezier(.25,.8,.25,1),-webkit-transform .25s cubic-bezier(.25,.8,.25,1);
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 36px);
    box-shadow:none;display:flex;flex-direction:column;
    overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;pointer-events:none;
  }
  nav.open{
    transform:translate3d(0,0,0) !important;-webkit-transform:translate3d(0,0,0) !important;
    box-shadow:6px 0 25px rgba(0,0,0,.3);visibility:visible;pointer-events:auto;
  }
  main{padding:16px 14px calc(env(safe-area-inset-bottom) + 85px);min-width:0;width:100%}
  .card,.q{padding:14px}
  body{font-size:15.5px}
}
@media(min-width:901px){ .backdrop{display:none!important} }

@media(max-width:600px){
  main{padding:14px 12px calc(env(safe-area-inset-bottom) + 85px)}
  .card,.q{padding:13px;border-radius:12px;margin-bottom:11px}
  .crumb{font-size:11.5px}
  h1.topic-title{font-size:clamp(20px,5.8vw,26px)}
  .hero{padding:20px 15px;border-radius:14px;margin-bottom:14px}
  .hero h1{font-size:clamp(20px,6vw,26px)}
  .node-cards{grid-template-columns:1fr;gap:10px}
  .task-grid{grid-template-columns:1fr;gap:8px}

  /* Formüller mobilde taşmadan alt satıra geçebilsin */
  .formula{
    white-space:normal;word-break:break-word;font-size:14px;
    padding:10px 12px;line-height:1.6;
  }

  /* Tablolar mobilde daha kompakt ve kaydırılabilir */
  table{font-size:13px;min-width:300px}
  th,td{padding:8px 10px}

  /* Konu tamamlama ve navigasyon butonları */
  .done-bar{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .done-bar #markDone{
    grid-column:1 / -1;width:100%;
  }
  .done-bar button[data-go]{
    width:100%;padding:11px 8px;font-size:14px;
  }

  /* Buton grupları tek sütun */
  .btn-row{flex-direction:column;gap:8px}
  .btn-row .btn{width:100%}

  /* Quiz şıkları daha dokunmatik dostu */
  .opt{padding:12px;font-size:14.5px;min-height:46px}

  /* Skor kutusu */
  .score{padding:16px 12px}

  /* Yazma atölyesi sayaç */
  .counter{gap:8px;font-size:13px}
  .cbar{min-width:100%;width:100%;order:3}

  /* Cümle analizleri */
  .sent{font-size:13.5px;gap:7px}
  .sent .sn{width:22px;height:22px;font-size:11px}
  .sent .sw{font-size:11px}
}

/* ---------- WRITING STUDIO ---------- */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-bottom:16px}
.task-btn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px;text-align:left;transition:.15s}
.task-btn:hover{border-color:var(--accent)}
.task-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.task-btn .tt{font-weight:700;font-size:14.5px;margin-bottom:2px}
.task-btn .td{font-size:12.5px;color:var(--muted);line-height:1.45}

.editor-wrap{position:relative}
textarea#draft{
  width:100%;min-height:230px;padding:14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;line-height:1.7;resize:vertical;outline:none;
  font-family:inherit;transition:.15s}
textarea#draft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.counter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:9px 0 12px;font-size:13.5px;color:var(--muted)}
.counter b{color:var(--text);font-size:15px}
.cbar{flex:1;min-width:110px;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:var(--warn);transition:.3s}
.cbar i.ok{background:var(--ok)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px}
.chip.link{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}

.find{border-left:3px solid;border-radius:0 10px 10px 0;background:var(--surface2);padding:10px 13px;margin-bottom:9px;font-size:14.5px}
.find.err{border-color:var(--err)}
.find.warn{border-color:var(--warn)}
.find.tip{border-color:var(--accent-2)}
.find .fh{font-weight:700;margin-bottom:3px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.find .badge2{font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:99px;text-transform:uppercase}
.find.err .badge2{background:var(--err-soft);color:var(--err)}
.find.warn .badge2{background:var(--warn-soft);color:var(--warn)}
.find.tip .badge2{background:var(--accent-soft);color:var(--accent)}
.find .frag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--err-soft);padding:1px 6px;border-radius:5px}
.find .fix{margin-top:5px;font-size:14px}
.find .fix b{color:var(--ok)}

.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;
  line-height:2;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
mark.mk{border-radius:4px;padding:1px 3px;color:inherit}
mark.mk.err{background:rgba(220,38,38,.22);box-shadow:inset 0 -2px 0 var(--err)}
mark.mk.warn{background:rgba(217,119,6,.22);box-shadow:inset 0 -2px 0 var(--warn)}
mark.mk.tip{background:rgba(13,148,136,.18);box-shadow:inset 0 -2px 0 var(--accent-2)}
mark.mk.fixd{background:rgba(22,163,74,.22);box-shadow:inset 0 -2px 0 var(--ok);font-weight:700}

.sent{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.sent:first-child{border-top:none}
.sent .sn{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--muted)}
.sent.bad .sn{background:var(--err-soft);color:var(--err)}
.sent.good .sn{background:var(--ok-soft);color:var(--ok)}
.sent .sw{flex:none;font-size:12px;color:var(--muted);align-self:center}

.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:14.5px}
.chk input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.model{display:none}
.model.show{display:block}

.toggle-row{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);
  border-radius:11px;margin-top:12px;cursor:pointer;transition:.15s}
.toggle-row:hover{border-color:var(--accent-2)}
.toggle-row.on{border-color:var(--accent-2);background:rgba(13,148,136,.07)}
.toggle-row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent-2);flex:none}
.toggle-row .tl{font-weight:700;font-size:14.5px;margin-bottom:3px}
.toggle-row .ts{font-size:13px;color:var(--muted);line-height:1.5}
.src{font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:99px;
  background:var(--surface2);color:var(--muted);text-transform:uppercase}
.src.online{background:rgba(13,148,136,.16);color:var(--accent-2)}
.src.ai{background:var(--accent-soft);color:var(--accent)}
.keyrow{margin-top:10px;font-size:13px;color:var(--muted)}
.keyrow summary{cursor:pointer;font-weight:600;color:var(--accent)}
.keyrow input{width:100%;margin-top:8px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
/* ---------- KELİME SÖZLÜĞÜ ---------- */
.w{border-bottom:1px dotted var(--muted);cursor:help}
.w:hover,.w.act{background:var(--accent-soft);border-radius:3px;border-bottom-color:var(--accent)}
#wtip{position:fixed;z-index:200;max-width:min(290px,88vw);background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:0 10px 34px rgba(16,24,40,.22);
  font-size:14px;line-height:1.5;display:none;pointer-events:auto}
html[data-theme="dark"] #wtip{box-shadow:0 10px 34px rgba(0,0,0,.55)}
#wtip.show{display:block}
#wtip .ww{font-weight:800;font-size:15.5px}
#wtip .wb{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px}
#wtip .wt{margin-top:4px}

 {t:"p", x:"<b>be going to</b>, konuşmadan <u>önce</u> verilmiş kararları (planları) ve <u>gözle görülür kanıta</u> dayanan tahminleri anlatır."},
 {t:"f", x:"(+) Özne + <b>am / is / are</b> + <b>going to</b> + V1"},
 {t:"f", x:"(−) am/is/are + <b>not</b> + going to + V1 &nbsp;&nbsp; (?) <b>Am/Is/Are</b> + Özne + going to + V1?"},
 {t:"h", x:"İki Temel Kullanım"},
 {t:"tbl", head:["Kullanım","Örnek","Açıklama"], rows:[
   ["Önceden yapılmış plan","We <b>are going to</b> buy a house next year.","Karar önceden verildi, niyet var."],
   ["Kanıta dayalı tahmin","Look at those clouds! It <b>is going to</b> rain.","Kanıt: bulutlar görünüyor."]
 ]},
 {t:"h", x:"Will vs Be going to — Kritik Fark"},
 {t:"tbl", head:["Durum","will","be going to"], rows:[
   ["Karar ne zaman verildi?","Konuşma anında (anlık)","Konuşmadan önce (planlı)"],
   ["Tahmin dayanağı","Kişisel görüş / his","Somut kanıt / işaret"],
   ["Örnek","I<b>'ll</b> have the chicken. (menüye bakıp karar)","I<b>'m going to</b> study medicine. (uzun süredir plan)"],
   ["Tahmin örneği","I think it <b>will</b> snow. (sanıyorum)","The sky is grey — it<b>'s going to</b> snow. (görüyorum)"]
 ]},
 {t:"tip", x:"Konuşma dilinde <i>going to go</i> yerine sadece Present Continuous tercih edilir: <b>I'm going to the cinema tonight.</b>"},
 {t:"ex", items:[
   ["She <span class='hl'>is going to</span> start a new job in June.","Haziranda yeni bir işe başlayacak. (plan)"],
   ["Be careful! You <span class='hl'>are going to</span> fall!","Dikkat et! Düşeceksin! (kanıt: dengesi bozuk)"],
   ["We <span class='hl'>aren't going to</span> travel this summer.","Bu yaz seyahat etmeyeceğiz."],
   ["<span class='hl'>Are</span> you <span class='hl'>going to</span> invite Mark?","Mark'ı davet edecek misin?"]
 ]}
],
q:[
 {q:"Look at the sky! It ___ rain.", o:["will","is going to","goes to","is raining"], a:1, e:"Gözle görülür kanıt var (gökyüzü) → be going to."},
 {q:"We've already booked the tickets. We ___ visit Rome.", o:["will","are going to","go","would"], a:1, e:"Karar önceden verilmiş, bilet alınmış → plan → be going to."},
 {q:"A: The doorbell is ringing. B: OK, I ___ open it.", o:["am going to","will","go to","would"], a:1, e:"Anlık karar → will."}
]
},

s:[

{
id:"can-could", node:2, title:"Can & Could", sub:"Yetenek, izin ve nazik rica",
s:[
 {t:"p", x:"<b>can</b> ve <b>could</b> modal fiillerdir. Modallerin üç değişmez kuralı vardır: (1) Ardından <b>yalın fiil</b> gelir, (2) 3. tekil şahısta <b>-s almazlar</b>, (3) Soru ve olumsuzda <b>do/does/did kullanılmaz</b>."},
 {t:"f", x:"(+) Özne + <b>can / could</b> + V1 &nbsp; (−) <b>can't / couldn't</b> + V1 &nbsp; (?) <b>Can / Could</b> + Özne + V1 ?"},
 {t:"h", x:"Kullanım Alanları"},
 {t:"tbl", head:["Yapı","İşlev","Örnek","Türkçe"], rows:[
   ["can","Şu anki yetenek","I <b>can</b> swim.","Yüzebilirim."],
   ["can't","Yetenek yokluğu","He <b>can't</b> drive.","Araba kullanamaz."],
   ["could","Geçmişteki genel yetenek","I <b>could</b> run fast when I was young.","Gençken hızlı koşabilirdim."],
   ["couldn't","Geçmişte yapamama","We <b>couldn't</b> find the address.","Adresi bulamadık."],
   ["Can I ...?","İzin isteme (samimi)","<b>Can I</b> use your phone?","Telefonunu kullanabilir miyim?"],
   ["Could I ...?","İzin isteme (nazik)","<b>Could I</b> ask you something?","Bir şey sorabilir miyim?"],
   ["Can/Could you ...?","Rica etme","<b>Could you</b> help me, please?","Bana yardım eder misiniz?"]
 ]},
 {t:"tip", x:"<b>could</b>, can'in geçmişi olmasının yanı sıra <u>daha kibar</u> bir tondur. Resmî ortamlarda ve yabancılarla <b>could</b> tercih edilir."},
 {t:"warn", lbl:"be able to", x:"can'in gelecek ve perfect hali yoktur; onun yerine <b>be able to</b> kullanılır:<br>I <b>will be able to</b> speak English next year. / I <b>have been able to</b> ..."},
 {t:"err", lbl:"Sık hata", x:"<s>She cans swim.</s> / <s>Do you can help?</s> / <s>I can to go.</s><br>✔ <b>She can swim.</b> / <b>Can you help?</b> / <b>I can go.</b>"},
 {t:"ex", items:[
   ["<span class='hl'>Can</span> you <span class='hl'>speak</span> any other languages?","Başka dil konuşabiliyor musun?"],
   ["I <span class='hl'>couldn't</span> sleep last night.","Dün gece uyuyamadım."],
   ["<span class='hl'>Could</span> you please <span class='hl'>repeat</span> that?","Lütfen tekrar eder misiniz?"]
 ]}
],

 {q:"He ___ play the guitar very well.", o:["can","cans","can to","is can"], a:0, e:"Modalden sonra yalın fiil, 3. tekilde -s yok."}
]
},

{
id:"may-might", node:2, title:"May, Might & Could", sub:"Olasılık dereceleri",
s:[
 {t:"p", x:"Bu üç modal <b>ihtimal</b> bildirir: 'olabilir', 'belki'. Emin olmadığımız durumlarda kullanılır ve hepsinden sonra <b>yalın fiil</b> gelir."},
 {t:"f", x:"Özne + <b>may / might / could</b> + V1 &nbsp;&nbsp; (−) <b>may not / might not</b> + V1"},
 {t:"h", x:"Kesinlik Ölçeği"},
 {t:"tbl", head:["Modal","Kesinlik","Örnek","Türkçe"], rows:[
   ["will / is","%100","She <b>is</b> at home.","Evde."],
   ["must","%95 (mantıklı çıkarım)","She <b>must</b> be at home; the light is on.","Evde olmalı."],
   ["may","%50 (nötr ihtimal)","She <b>may</b> be at home.","Evde olabilir."],
   ["might","%40 (biraz daha zayıf)","She <b>might</b> be at home.","Evde olabilir (belki)."],
   ["could","%40 (mümkün seçenek)","She <b>could</b> be at home.","Evde olabilir."],
   ["can't","%5 (imkânsız çıkarım)","She <b>can't</b> be at home; her car is gone.","Evde olamaz."]
 ]},
 {t:"tip", x:"Pratikte A2 seviyesinde <b>may / might / could</b> arasındaki fark çok küçüktür ve genellikle birbirinin yerine kullanılabilir. <b>might</b> en yaygın olanıdır."},
 {t:"warn", lbl:"may + izin", x:"<b>may</b> aynı zamanda çok resmî izin isteme kalıbıdır: <i><b>May I</b> come in?</i> (İçeri girebilir miyim?) — Could I'den bile daha resmîdir."},
 {t:"err", lbl:"Olumsuz farkı", x:"<b>might not</b> = olmayabilir (ihtimal). <b>can't</b> = olması imkânsız (kesin çıkarım).<br><i>He <b>might not</b> come.</i> (gelmeyebilir) &nbsp;≠&nbsp; <i>He <b>can't</b> be here.</i> (burada olması imkânsız)"},
 {t:"ex", items:[
   ["It <span class='hl'>might</span> snow tonight, take your coat.","Bu gece kar yağabilir, montunu al."],
   ["I'm not sure. I <span class='hl'>may</span> go to the party.","Emin değilim. Partiye gidebilirim."],
   ["Where is Tom? — He <span class='hl'>could</span> be in the garden.","Tom nerede? — Bahçede olabilir."],
   ["She <span class='hl'>may not</span> like this idea.","Bu fikri sevmeyebilir."]
 ]}
],
q:[
 {q:"Take an umbrella. It ___ rain later.", o:["must","might","can","should"], a:1, e:"Belirsiz ihtimal → might."},

]
},

var LS_KEY = "a2gram_done_v1", THEME_KEY = "a2gram_theme_v1";
var done = {};
try { done = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch(e){ done = {}; }
function saveDone(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(done)); }catch(e){} }

var el = function(id){ return document.getElementById(id); };
var main = el("main"), nav = el("nav"), navList = el("navList"), backdrop = el("backdrop"), fab = el("fabNext");
var current = null;

/* ---------- Tema ---------- */
(function(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(!saved) saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", saved);
})();
el("themeBtn").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
};

/* ---------- Menü ---------- */
function openNav(e){
  if(e){ if(e.preventDefault) e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); }
  nav.classList.add("open");
  backdrop.classList.add("show");
  document.documentElement.classList.add("nav-open");
}
function closeNav(e){
  if(e && e.preventDefault) e.preventDefault();
  nav.classList.remove("open");
  backdrop.classList.remove("show");
  document.documentElement.classList.remove("nav-open");
}
var menuBtn = el("menuBtn");
if(menuBtn){
  menuBtn.onclick = openNav;
  menuBtn.ontouchend = function(e){ e.preventDefault(); openNav(e); };
}
if(backdrop){
  backdrop.onclick = closeNav;
  backdrop.ontouchend = function(e){ e.preventDefault(); closeNav(e); };
}
var navCloseBtn = el("navCloseBtn");
if(navCloseBtn){
  navCloseBtn.onclick = closeNav;
  navCloseBtn.ontouchend = function(e){ e.preventDefault(); closeNav(e); };
}

/* ---------- Escape ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- Navigasyon listesi ---------- */
function buildNav(filter){
  filter = (filter||"").trim().toLowerCase();
  var html = "";
  NODES.forEach(function(nd){
    var items = T.filter(function(t){
      if(t.node !== nd.n) return false;
      if(!filter) return true;
      var hay = (t.title + " " + t.sub + " " + JSON.stringify(t.s)).toLowerCase();
      return hay.indexOf(filter) > -1;
    });
    if(!items.length) return;
    html += '<div class="node-group"><div class="node-head"><span class="node-num">'+nd.n+'</span><span>'+nd.title+'</span></div>';
    items.forEach(function(t){
      html += '<button class="nav-item'+(done[t.id]?" done":"")+(current===t.id?" active":"")+'" data-go="'+t.id+'">'+
              '<i class="dot"></i><span>'+esc(t.title)+'</span></button>';
    });
    html += '</div>';
  });
  if(!html) html = '<div class="empty">Sonuç bulunamadı.</div>';
  navList.innerHTML = html;
  updateProgress();
}
function updateProgress(){
  var total = T.length, d = 0;
  T.forEach(function(t){ if(done[t.id]) d++; });
  el("progTxt").textContent = d + " / " + total;
  el("progFill").style.width = (total ? (d/total*100) : 0) + "%";
}

/* ---------- Bölüm render ---------- */
function renderSections(secs){
  var out = "", buf = "", open = false;
  function flush(){ if(open){ out += '<div class="card">'+buf+'</div>'; buf=""; open=false; } }
  secs.forEach(function(s){
    if(s.t === "h"){ flush(); open = true; buf += '<h3><span class="ico">◆</span>'+s.x+'</h3>'; return; }
    if(!open){ open = true; }
    if(s.t === "p") buf += '<p>'+s.x+'</p>';
    else if(s.t === "f") buf += '<div class="formula">'+s.x+'</div>';
    else if(s.t === "ul"){ buf += '<ul>'+s.items.map(function(i){return '<li>'+i+'</li>';}).join("")+'</ul>'; }
    else if(s.t === "tbl"){
      var h = '<div class="tbl-scroll"><table><thead><tr>'+s.head.map(function(x){return '<th>'+x+'</th>';}).join("")+'</tr></thead><tbody>';
      s.rows.forEach(function(r){ h += '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join("")+'</tr>'; });
      buf += h + '</tbody></table></div>';
    }
    else if(s.t === "ex"){
      buf += s.items.map(function(p){ return '<div class="ex"><div class="en">'+p[0]+'</div><div class="tr">'+p[1]+'</div></div>'; }).join("");
    }
    else if(s.t === "tip") buf += '<div class="note tip"><b class="lbl">'+(s.lbl||"İpucu")+'</b>'+s.x+'</div>';
    else if(s.t === "warn") buf += '<div class="note warn"><b class="lbl">'+(s.lbl||"Dikkat")+'</b>'+s.x+'</div>';
    else if(s.t === "err") buf += '<div class="note err"><b class="lbl">'+(s.lbl||"Hata")+'</b>'+s.x+'</div>';
  });
  flush();
  return out;
}

/* ---------- Quiz render ---------- */
function renderQuiz(qs, prefix){
  var h = '<h3 style="margin:24px 0 12px;font-size:18px;font-weight:800;">◎ Alıştırma</h3>';
  qs.forEach(function(q, i){
    h += '<div class="q" data-q="'+prefix+i+'"><div class="q-num">Soru '+(i+1)+'</div>'+
         '<div class="q-text">'+esc(q.q).replace(/___/g,'<span class="k">_____</span>')+'</div>';
    q.o.forEach(function(o, j){
      h += '<button class="opt" data-qi="'+i+'" data-oi="'+j+'">'+String.fromCharCode(65+j)+') '+esc(o)+'</button>';
    });
    h += '<div class="q-exp"></div></div>';
  });
  return h;
}
function wireQuiz(root, qs, onAnswer){
  root.querySelectorAll(".opt").forEach(function(btn){
    btn.onclick = function(){
      var qi = +btn.getAttribute("data-qi"), oi = +btn.getAttribute("data-oi");
      var box = btn.closest(".q");
      if(box.dataset.answered) return;
      box.dataset.answered = "1";
      var correct = qs[qi].a;
      box.querySelectorAll(".opt").forEach(function(b,k){
        b.disabled = true;
        if(k === correct) b.classList.add("correct");
        else if(k === oi) b.classList.add("wrong");
      });
      var exp = box.querySelector(".q-exp");
      exp.innerHTML = (oi===correct ? "<b>✓ Doğru!</b> " : "<b>✗ Yanlış.</b> Doğru cevap: <b>"+esc(qs[qi].o[correct])+"</b>. ") + qs[qi].e;
      exp.classList.add("show");
      if(onAnswer) onAnswer(oi === correct);
    };
  });
}

function toV2(v){

/* ---- Çevrimdışı yazım önerisi (Levenshtein) ---- */
function editDist(a, b, max){
  var la = a.length, lb = b.length;
  if(Math.abs(la - lb) > max) return max + 1;
  var prev = [], cur = [], i, j;
  for(j = 0; j <= lb; j++) prev[j] = j;
  for(i = 1; i <= la; i++){
    cur[0] = i;
    var best = cur[0];
    for(j = 1; j <= lb; j++){
      var cost = a.charAt(i-1) === b.charAt(j-1) ? 0 : 1;
      cur[j] = Math.min(cur[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
      if(cur[j] < best) best = cur[j];
    }
    if(best > max) return max + 1;
    for(j = 0; j <= lb; j++) prev[j] = cur[j];
  }
  return prev[lb];
}

function suggestSpelling(word){
  var w = String(word).toLowerCase();
  if(SUGG_CACHE[w] !== undefined) return SUGG_CACHE[w];
  buildDict();
  var keys = LEMMAS;                      /* sadece kök kelimeler — üretilmiş çekimler değil */
  var maxD = w.length <= 4 ? 1 : 2;       /* kısa kelimelerde 2 mesafe çok gürültülü */
  var c0 = w.charAt(0), cz = w.charAt(w.length - 1);
  var best = null, bestScore = 999;
  for(var i = 0; i < keys.length; i++){
    var k = keys[i];
    if(Math.abs(k.length - w.length) > maxD) continue;
    var dist = editDist(w, k, maxD);
    if(dist > maxD) continue;
    /* Aynı mesafedeyse: ilk harfi tutan aday çok daha olasıdır */
    var score = dist * 10
              - (k.charAt(0) === c0 ? 4 : 0)
              - (k.charAt(k.length-1) === cz ? 2 : 0)
              - (k.length === w.length ? 1 : 0);
    if(score < bestScore){ bestScore = score; best = k; if(score <= 3) break; }
  }
  /* Çoğul/çekimli yazım hatası: kökü düzelt, eki geri ekle (freinds → friends) */
  if(!best){
    var suf = /(ies|es|s|ed|ing)$/.exec(w);
    if(suf && w.length - suf[0].length >= 3){
      var stem = w.slice(0, w.length - suf[0].length);
      var sb = suggestSpelling(stem);
      if(sb) best = suf[0] === "ies" ? sb.replace(/y$/, "") + "ies"
                 : suf[0] === "ing" ? ing(sb)
                 : suf[0] === "ed"  ? toV2(sb)
                 : /(s|x|z|ch|sh|o)$/.test(sb) ? sb + "es" : sb + "s";
    }
  }
  SUGG_CACHE[w] = best;
  return best;
}

      add(off, qBad[0].length, "err", "Soru cümlesinde kelime sırası",
        "Soru cümlesinde sıra: <b>Soru kelimesi + yardımcı fiil + özne + fiil</b>. Özne ile yardımcı fiil yer değiştirmiş.",
        qBad[1] + " " + qBad[3] + " " + qBad[2], null);

    /* Yapısal çözümleme: cümleyi etiketle ve yapı kurallarını uygula */
    try{ structuralCheck(trimmed, off, add); }catch(e){}
    if(/\b(have|has)\s+[a-z]+(ed|en)\b/i.test(trimmed) && /\b(yesterday|last\s+(night|week|month|year|summer)|ago|in\s+(19|20)\d{2})\b/i.test(trimmed))
    {
      var hp = /\b(have|has)\s+([a-z]+)\b/i.exec(trimmed);
      var hpFix = "";
      if(hp){
        var v1 = IRR2BASE[hp[2].toLowerCase()] || deEd(hp[2]);
        hpFix = toV2(v1) + "  (yani \"" + hp[1] + " " + hp[2] + "\" yerine)";
      }
      add(off, clampLen(trimmed, 28), "err", "Present Perfect + belirli geçmiş", "Cümlede <b>yesterday / last… / ago</b> gibi belirli geçmiş zaman varsa Present Perfect kullanılmaz; <b>Past Simple</b> gerekir.", hpFix, "present-perfect");
    }
  });
  /* Genel */
  var words = txt.trim().split(/\s+/).filter(Boolean);
  if(words.length && !/[.!?]\s*$/.test(txt.trim()))
    add(-1, 0, "warn", "Son nokta eksik", "Yazının son cümlesi <b>nokta</b> ile bitmiyor.", "", null);
  if(words.length > 25 && !/\b(and|but|because|so|then|also|however|after that|first|finally)\b/i.test(txt))
    add(-1, 0, "tip", "Bağlaç kullan", "Hiç bağlaç kullanmamışsın. <b>and, but, because, so, then, after that</b> yazını çok daha akıcı yapar.", "", "time-connectors");
  out.sort(function(a,b){ return (a.i<0?1e9:a.i) - (b.i<0?1e9:b.i); });
  /* aynı konumda tekrarları temizle */
  var seen = {}, uniq = [];
  out.forEach(function(f){ var k = f.i+"|"+f.t; if(seen[k]) return; seen[k]=1; uniq.push(f); });
  return {findings:uniq, words:words.length, sents:sents};
}

function highlight(txt, fs){
  var h = "", last = 0;
  fs.filter(function(f){return f.i >= 0;}).forEach(function(f){
    if(f.i < last) return;
    h += esc(txt.slice(last, f.i)) + '<mark class="mk '+f.sev+'">' + esc(txt.slice(f.i, f.e)) + '</mark>';
    last = f.e;
  });
  return h + esc(txt.slice(last));
}

var GLOSS = null;
function buildGloss(){
  if(GLOSS) return GLOSS;
  var g = {};
  GLOSS_RAW.split("|").forEach(function(pair){
    var k = pair.indexOf("=");
    if(k > 0){ var w = pair.slice(0,k).trim().toLowerCase(); if(w) g[w] = pair.slice(k+1).trim(); }
  });
  GLOSS = g;
  return g;
}

/* Bir kelimeyi köküne indirip anlamını bul */
function lookup(word){
  var g = buildGloss();
  var w = String(word).toLowerCase().replace(/[^a-z']/g, "");
  if(!w) return null;
  if(g[w]) return {w:word, base:w, tr:g[w], note:""};

  if(IRR2BASE[w] && g[IRR2BASE[w]])
    return {w:word, base:IRR2BASE[w], tr:g[IRR2BASE[w]], note:IRR_NOTE[w] ? "düzensiz fiilin geçmiş hâli" : "düzensiz çoğul/hâl"};

  var ap = w.indexOf("'");
  if(ap > 0){
    var stem = w.slice(0, ap), suf = w.slice(ap+1);
    var sufTr = {s:"…dir / …in", t:"olumsuzluk (not)", re:"…siniz (are)", ve:"…dim (have)",
                 ll:"…ecek (will)", d:"…ardı (would/had)", m:"…im (am)"}[suf];
    if(g[stem]) return {w:word, base:stem, tr:g[stem], note:sufTr ? "kısaltma: '" + suf + " = " + sufTr : "kısaltma"};
  }

  var cands = [];
  if(/ies$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/ied$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/iest$/.test(w)) cands.push(w.slice(0,-4) + "y");
  if(/ier$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/ily$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/es$/.test(w)) cands.push(w.slice(0,-2));
  if(/s$/.test(w)) cands.push(w.slice(0,-1));
  if(/ed$/.test(w)) cands.push(deEd(w));
  if(/ing$/.test(w)) cands.push(deing(w));
  if(/est$/.test(w)) { cands.push(w.slice(0,-3)); cands.push(w.slice(0,-2)); }
  if(/er$/.test(w)) { cands.push(w.slice(0,-2)); cands.push(w.slice(0,-1)); }
  if(/ly$/.test(w)) cands.push(w.slice(0,-2));
  if(/([^aeiou])\1(ed|ing|er|est)$/.test(w)) cands.push(w.replace(/([^aeiou])\1(ed|ing|er|est)$/, "$1"));

  for(var i=0;i<cands.length;i++){
    var c = cands[i];
    if(c && c !== w && g[c]){
      var note = /ing$/.test(w) ? "-ing hâli" : /ed$/.test(w) ? "geçmiş / -ed hâli"
               : /(iest|est)$/.test(w) ? "en üstünlük hâli" : /(ier|er)$/.test(w) ? "karşılaştırma / -er hâli"
               : /ly$/.test(w) ? "zarf hâli" : "çoğul / -s hâli";
      return {w:word, base:c, tr:g[c], note:note};
    }
  }
  return null;
}

/* Metin düğümlerindeki kelimeleri sarmala */
function applyGloss(root){
  if(!root) return;
  var sels = ".ex .en, .q-text, .preview, .model p, .gl";
  var targets = root.querySelectorAll(sels);
  for(var t=0; t<targets.length; t++){
    var cont = targets[t];
    if(cont.dataset.glossed) continue;
    cont.dataset.glossed = "1";
    var nodes = [], walk = document.createTreeWalker(cont, NodeFilter.SHOW_TEXT, null);
    var n; while((n = walk.nextNode())) if(/[A-Za-z]/.test(n.nodeValue)) nodes.push(n);
    nodes.forEach(function(node){
      var parent = node.parentNode;
      if(!parent || parent.classList && parent.classList.contains("w")) return;
      if(parent.closest && parent.closest("code, .frag, mark.mk .w")) return;
      var txt = node.nodeValue, frag = document.createDocumentFragment();
      var re = /[A-Za-z][A-Za-z']*/g, m, last = 0, any = false;
      while((m = re.exec(txt)) !== null){
        var hit = lookup(m[0]);
        if(!hit) continue;
        any = true;
        if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var sp = document.createElement("span");
        sp.className = "w"; sp.textContent = m[0];
        sp.setAttribute("data-b", hit.base); sp.setAttribute("data-t", hit.tr); sp.setAttribute("data-n", hit.note || "");
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if(!any) return;
      if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      parent.replaceChild(frag, node);
    });
  }
}

var wtip = null, wcur = null;
function showTip(elm){
  if(!wtip){
    wtip = document.createElement("div");
    wtip.id = "wtip";
    wtip.onclick = hideTip;
    document.body.appendChild(wtip);
  }
  var word = elm.textContent, base = elm.getAttribute("data-b"),
      tr = elm.getAttribute("data-t"), note = elm.getAttribute("data-n");
  wtip.innerHTML = '<div><span class="ww">' + esc(word) + '</span>' +
    (base && base.toLowerCase() !== word.toLowerCase() ? '<span class="wb">→ ' + esc(base) + '</span>' : '') +
    '</div><div class="wt">' + esc(tr) + '</div>' +
    (note ? '<div class="wn">' + esc(note) + '</div>' : '');
  wtip.classList.add("show");
  if(wcur) wcur.classList.remove("act");
  wcur = elm; elm.classList.add("act");
  var r = elm.getBoundingClientRect(), tw = wtip.offsetWidth, th = wtip.offsetHeight;
  var x = Math.min(Math.max(8, r.left + r.width/2 - tw/2), window.innerWidth - tw - 8);
  var y = r.top - th - 9;
  if(y < 8) y = r.bottom + 9;
  if(y + th > window.innerHeight - 8) y = Math.max(8, window.innerHeight - th - 8);
  wtip.style.left = x + "px";
  wtip.style.top = y + "px";
}
function hideTip(){
  if(wtip) wtip.classList.remove("show");
  if(wcur){ wcur.classList.remove("act"); wcur = null; }
}
document.addEventListener("mouseover", function(e){
  var t = e.target.closest && e.target.closest(".w");
  if(t) showTip(t);
});
document.addEventListener("mouseout", function(e){
  if(e.target.closest && e.target.closest(".w")) hideTip();
});
document.addEventListener("click", function(e){
  var t = e.target.closest && e.target.closest(".w");
  if(t){ e.stopPropagation(); if(wcur === t) hideTip(); else showTip(t); }
  else hideTip();
}, true);
window.addEventListener("scroll", hideTip, true);

      fetch("https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent", {
        method:"POST",
        headers:{"Content-Type":"application/json", "x-goog-api-key":key},
        body:JSON.stringify({
          systemInstruction:{parts:[{text:AI_SYS}]},
          contents:[{parts:[{text:"Student text:\n" + text}]}],
          generationConfig:{responseMimeType:"application/json", responseSchema:AI_SCHEMA, temperature:0.2}
        })
      }).then(function(r){
        return r.json().then(function(j){
          if(!r.ok){
            var e = new Error((j.error && j.error.message) || ("HTTP " + r.status));
            e.code = r.status; e.status = j.error && j.error.status;
            throw e;
          }
          return j;
        });
      }).then(function(j){
        aiCountToday(true);
        var raw = j.candidates && j.candidates[0] && j.candidates[0].content.parts[0].text;
        var out = JSON.parse(raw);
        var used = [], findings = [];
        (out.issues || []).forEach(function(is){
          if(!is.quote) return;
          /* Önce hatanın bulunduğu CÜMLEYİ konumla, sonra alıntıyı o cümlenin içinde ara.
             Yoksa "go" gibi kısa alıntılar metnin başka bir yerine eşleşiyor. */
          var base = 0, scope = text;
          if(is.sentence){
            var si = text.indexOf(is.sentence);
            if(si >= 0){ base = si; scope = is.sentence; }
          }
          var from = 0, rel;
          if(/^[^A-Za-z0-9]+$/.test(is.quote)){
            /* Alıntı yalnızca noktalama ise ("." → "?") ileri arama yanlış yere düşer:
               cümlenin SONUNDAKİ noktalamayı hedefle. */
            rel = scope.lastIndexOf(is.quote);
            if(rel < 0) rel = scope.length - is.quote.length;
          } else {
            do { rel = scope.indexOf(is.quote, from); from = rel + 1; }
            while(rel >= 0 && used.indexOf(base + rel) >= 0);
          }
          var idx = rel >= 0 ? base + rel : -1;
          if(idx < 0 && base === 0){ return; }      /* bulunamazsa atla, uydurma konum verme */
          if(idx < 0) idx = base;                   /* cümle bulundu ama alıntı bulunamadı: cümleye çapala */
          used.push(idx);
          findings.push({
            i:idx, e:idx + (rel >= 0 ? is.quote.length : Math.min(is.sentence.length, 40)),
            sev:(is.kind === "meaning" || is.kind === "grammar") ? "err" : "warn",
            ai:true, t:(AI_KIND_TR[is.kind] || "Öneri"), frag:is.quote,
            m:esc(is.explain_tr || ""), fix:is.fix || "", link:null
          });
        });
        resolve({findings:findings, corrected:out.corrected || "", summary:out.summary_tr || "",
                 usage:j.usageMetadata || null});
      }).catch(reject);
    }, wait);
  });
}

/* ---------- LanguageTool (ücretsiz, anahtarsız API) ---------- */
var LT_URL = "https://api.languagetool.org/v2/check";
var ltLast = 0;

var LT_CAT = {misspelling:"Yazım", grammar:"Gramer", typographical:"Noktalama", whitespace:"Boşluk",
  duplication:"Tekrar", style:"Üslup", inconsistency:"Tutarsızlık", "non-conformance":"Kullanım",
  "locale-violation":"Kullanım", uncategorized:"Öneri", other:"Öneri"};
var LT_TR = [
 [/possible spelling mistake/i, "Olası yazım hatası. Bu kelime İngilizce sözlükte yok."],
 [/usually used with a third-person/i, "Bu özne ile fiil <b>-s</b> alır (geniş zaman) veya <b>V2</b> olmalı (geçmiş)."],
 [/does not seem to match|agreement error|agreement between/i, "<b>Özne-yüklem uyumu</b> hatası: özne ile fiil uyuşmuyor."],
 [/start with an uppercase letter|sentence does not start/i, "Cümle <b>büyük harfle</b> başlamalı."],
 [/use a comma before/i, "İki bağımsız cümleyi birleştiren bağlaçtan önce <b>virgül</b> konur."],
 [/you repeated a word|word repetition/i, "<b>Kelime tekrarı</b> var."],
 [/did you mean/i, "Şunu mu demek istediniz?"],
 [/consecutive spaces|whitespace/i, "Fazladan <b>boşluk</b> var."],
 [/missing (a )?(full stop|period|punctuation)/i, "<b>Noktalama</b> eksik."],
 [/article|determiner/i, "<b>a / an / the</b> kullanımını kontrol et."],
 [/singular|plural/i, "<b>Tekil / çoğul</b> uyumunu kontrol et."],
 [/apostrophe/i, "<b>Kesme işareti</b> kullanımı."],
 [/preposition/i, "<b>Edat</b> kullanımını kontrol et."],
 [/tense/i, "<b>Zaman</b> kullanımını kontrol et."]
];
function ltTranslate(msg){
  for(var i=0;i<LT_TR.length;i++) if(LT_TR[i][0].test(msg)) return LT_TR[i][1];
  return "";
}
function ltCheck(text){
  var wait = Math.max(0, 2500 - (Date.now() - ltLast));
  return new Promise(function(resolve, reject){
    setTimeout(function(){
      ltLast = Date.now();
      var body = "text=" + encodeURIComponent(text) + "&language=en-US&level=default";
      fetch(LT_URL, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:body})
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          resolve((j.matches||[]).filter(function(m){
            var frag = text.substr(m.offset, m.length);
            var it = (m.rule && m.rule.issueType) || "other";
            if(it !== "misspelling") return true;
            /* Büyük harfle başlıyor ve cümle başında değilse → özel isim, dokunma */
            if(/^[A-Z]/.test(frag)){
              var before = text.slice(0, m.offset).replace(/\s+$/, "");
              if(before && !/[.!?:;"]$/.test(before)) return false;
            }
            /* Tek kelimeyi ikiye bölen öneriler (Bodrum → Bo drum) neredeyse hep yanlıştır */
            var reps = (m.replacements||[]).map(function(x){ return x.value; });
            if(!/\s/.test(frag) && reps.length && reps.every(function(v){ return /\s/.test(v); })) return false;
            return true;
          }).map(function(m){
            var it = (m.rule && m.rule.issueType) || "other";
            var cat = LT_CAT[it] || "Öneri";
            var tr = ltTranslate(m.message);
            var sev = (it === "misspelling" || it === "grammar") ? "err"
                    : (it === "style" || it === "uncategorized") ? "tip" : "warn";
            return {
              i:m.offset, e:m.offset + m.length, sev:sev, online:true,
              t:cat, frag:text.substr(m.offset, m.length),
              m:(tr ? tr + '<br><span style="color:var(--muted);font-size:13px">' + esc(m.message) + '</span>' : esc(m.message)),
              fix:(m.replacements||[]).slice(0,3).map(function(x){return x.value;}).join("  /  "),
              link:null
            };
          }));
        })
        .catch(reject);
    }, wait);
  });
}

function runCheck(text, task){
  var box = el("result");
  if(!text.trim()){ box.innerHTML = '<div class="note warn"><b class="lbl">Boş</b>Önce birkaç cümle yaz, sonra kontrol et.</div>'; return; }
  var r = checkText(text);
  render(r, null);

  var btn = el("checkBtn");
  var plainT = text.replace(/’/g,"'");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Yapay zekâ denetliyor...';

  /* Dış bulguları kendi bulgularımla birleştir (çakışanlarda benimki öncelikli) */
  function merge(ext){
    var mine = r.findings.filter(function(f){ return f.i >= 0; });
    var extra = [];
    ext.forEach(function(o){
      var hit = mine.filter(function(f){ return o.i < f.e && f.i < o.e; })[0];
      if(hit){
        if(o.fix && !hit.fix) hit.fix = o.fix;
        else if(o.fix && hit.fix && hit.fix.toLowerCase() !== o.fix.toLowerCase()) hit.alt = o.fix;
        return;
      }
      extra.push(o);
    });
    var m = {findings: r.findings.concat(extra), words:r.words, sents:r.sents};
    m.findings.sort(function(a,b){ return (a.i<0?1e9:a.i) - (b.i<0?1e9:b.i); });
    return {res:m, n:extra.length};
  }
  function done(){ btn.disabled = false; btn.textContent = "✓ Kontrol Et"; }

  aiCheck(plainT).then(function(ai){
    var mg = merge(ai.findings);
    render(mg.res, {src:"ai", n:mg.n, corrected:ai.corrected, summary:ai.summary, usage:ai.usage});
    done();
  }).catch(function(err){
    /* Yapay zekâ kullanılamıyorsa LanguageTool'a düş */
    var why = err && err.code === 429 ? "quota"
            : err && (err.code === 401 || err.code === 403) ? "key"
            : err && err.message === "NOKEY" ? "nokey" : "net";
    btn.innerHTML = '<span class="spin"></span> LanguageTool deneniyor...';
    ltCheck(plainT).then(function(lt){
      var mg = merge(lt);
      render(mg.res, {src:"lt", n:mg.n, aiFail:why, msg:String(err && err.message || err)});
    }).catch(function(e2){
      render(r, {src:"none", aiFail:why, msg:String(err && err.message || err)});
    }).then(done);
  });

  function render(res, net){
    box.innerHTML = buildReport(res, net, text);
    applyGloss(box);
    var cb = el("copyFixed");
    if(cb) cb.onclick = function(){
      var t = el("fixedText").textContent;
      try{
        navigator.clipboard.writeText(t).then(function(){ cb.textContent = "✓ Kopyalandı"; },
          function(){ fallbackCopy(t, cb); });
      }catch(e){ fallbackCopy(t, cb); }
    };
    if(!net) box.scrollIntoView({behavior:"smooth", block:"start"});
  }
  function fallbackCopy(t, cb){
    var ta2 = document.createElement("textarea");
    ta2.value = t; ta2.style.position = "fixed"; ta2.style.opacity = "0";
    document.body.appendChild(ta2); ta2.select();
    try{ document.execCommand("copy"); cb.textContent = "✓ Kopyalandı"; }
    catch(e){ cb.textContent = "Kopyalanamadı — elle seç"; }
    document.body.removeChild(ta2);
  }
}

/* Bir bulgunun otomatik uygulanabilir tek bir düzeltmesi var mı? */
function cleanRep(f){
  if(f.i < 0 || !f.fix) return null;
  var s = String(f.fix).split("  /  ")[0].split(" / ")[0].trim();
  if(/[(){}]|ya da|veya|…|yerine/.test(s)) return null;
  if(!s || s.length > 40) return null;
  /* Tek kelimeyi ikiye bölen düzeltmeyi otomatik uygulama */
  if(f.frag && !/\s/.test(f.frag) && /\s/.test(s)) return null;
  return s;
}
/* Düzeltmeleri metne uygula */
function applyFixes(text, findings){
  var list = findings.filter(function(f){ return f.i >= 0 && cleanRep(f); })
                     .sort(function(a,b){ return a.i - b.i; });
  var out = "", last = 0, n = 0;
  list.forEach(function(f){
    if(f.i < last) return;
    var rep = cleanRep(f);
    if(text.slice(f.i, f.e) === rep) return;
    out += esc(text.slice(last, f.i)) + '<mark class="mk fixd">' + esc(rep) + '</mark>';
    last = f.e; n++;
  });
  return {html: out + esc(text.slice(last)), n: n};
}

function buildReport(r, net, text){

           '<div>'+f.m+'</div>'+
           (f.fix ? '<div class="fix">→ Doğrusu: <b>'+esc(f.fix)+'</b></div>' : '')+
           (f.alt ? '<div class="fix" style="opacity:.75">→ LanguageTool önerisi: <b>'+esc(f.alt)+'</b></div>' : '')+
           (f.link ? '<div class="fix"><span class="chip link" data-go="'+f.link+'">Konuyu aç ›</span></div>' : '')+

  var plain = text.replace(/’/g,"'");
  h += '<h3 style="margin:22px 0 10px;font-size:18px;font-weight:800;">İşaretlenmiş Metin</h3>'+
       '<div class="preview">'+highlight(plain, r.findings)+'</div>';

  if(net && net.src === "ai" && net.corrected){
    h += '<h3 style="margin:22px 0 10px;font-size:18px;font-weight:800;">Düzeltilmiş Metin</h3>'+
         '<p style="font-size:13.5px;color:var(--muted);margin:0 0 10px">'+
         'Yapay zekânın düzelttiği tam metin. Kendi yazınla karşılaştır — neyi neden değiştirdiğini yukarıdaki bulgulardan gör.</p>'+
         '<div class="preview" id="fixedText">'+esc(net.corrected)+'</div>'+
         '<div class="btn-row"><button class="btn" id="copyFixed">Düzeltilmiş metni kopyala</button></div>';
  } else {
    var fixed = applyFixes(plain, r.findings);
    if(fixed.n){
      h += '<h3 style="margin:22px 0 10px;font-size:18px;font-weight:800;">Düzeltilmiş Metin</h3>'+
           '<p style="font-size:13.5px;color:var(--muted);margin:0 0 10px">'+fixed.n+' düzeltme uygulandı — '+
           'yeşil işaretli yerler değiştirildi. Öneri kesin olmayan bulgular (üslup, uzun cümle, birden fazla seçenek) '+
           'burada uygulanmadı; onları kendin düzelt.</p>'+
           '<div class="preview" id="fixedText">'+fixed.html+'</div>'+
           '<div class="btn-row"><button class="btn" id="copyFixed">Düzeltilmiş metni kopyala</button></div>';
    }
  }

  h += '<h3 style="margin:22px 0 10px;font-size:18px;font-weight:800;">Cümle Cümle</h3><div class="card">';
  r.sents.forEach(function(s, i){
    var n = r.findings.filter(function(f){ return f.i >= s.i && f.i < s.i + s.txt.length; }).length;
    h += '<div class="sent '+(n?"bad":"good")+'"><span class="sn">'+(n?n:"✓")+'</span>'+
         '<span style="flex:1">'+esc(s.txt.trim())+'</span><span class="sw">'+s.w+' kel.</span></div>';
  });
  h += '</div>';
  return h;
}

/* ---------- Yönlendirme ---------- */
function go(id){ if(id === "__home") showHome(); else if(id === "__write") showWriting(); else showTopic(id); }
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if(b){ go(b.getAttribute("data-go")); }
});
el("homeBtn").onclick = showHome;
el("bigQuizBtn").onclick = showBigQuiz;
el("writeBtn").onclick = function(){ showWriting(); };
el("search").addEventListener("input", function(){ buildNav(this.value); });
window.addEventListener("resize", function(){
  if(window.innerWidth > 900){
    closeNav();
    if(fab) fab.style.display = "none";
  } else if(current && fab){
    fab.style.display = "inline-flex";
  }
});

/* ---------- Başlat ---------- */
buildNav("");
showHome();
</script>
