<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>A2 İngilizce Gramer Haritası</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#f0f2f8; --text:#1b1f2e; --muted:#6b7280;
  --line:#e3e6ef; --accent:#4f46e5; --accent-soft:#eef0ff; --accent-2:#0d9488;
  --ok:#16a34a; --ok-soft:#e8f7ee; --warn:#d97706; --warn-soft:#fdf3e3; --err:#dc2626; --err-soft:#fdecec;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --nav-w:300px;
}
html[data-theme="dark"]{
  --bg:#0f1117; --surface:#171a23; --surface2:#1e222d; --text:#e8eaf2; --muted:#9aa1b1;
  --line:#2a2f3d; --accent:#8b8cf7; --accent-soft:#242642; --accent-2:#2dd4bf;
  --ok:#4ade80; --ok-soft:#16281d; --warn:#fbbf24; --warn-soft:#2b2214; --err:#f87171; --err-soft:#2c1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;
}
html.nav-open, html.nav-open body{overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:16px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--surface2);border:1px solid var(--line);transition:.15s}
.icon-btn:active{transform:scale(.93)}
#menuBtn{display:none}

/* ---------- LAYOUT ---------- */
.wrap{display:flex;align-items:flex-start;max-width:1280px;margin:0 auto}
nav{
  width:var(--nav-w);flex:none;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto;
  padding:16px 10px 40px;border-right:1px solid var(--line);
}
main{flex:1;min-width:0;padding:18px 16px 90px}

/* ---------- SEARCH ---------- */
.search-box{position:relative;margin-bottom:14px}
.search-box input{
  width:100%;padding:11px 12px 11px 36px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:.15s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-box::before{content:"⌕";position:absolute;left:12px;top:8px;font-size:19px;color:var(--muted)}

/* ---------- PROGRESS ---------- */
.prog-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:600}
.prog-bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .4s}

/* ---------- NAV LIST ---------- */
.node-group{margin-bottom:16px}
.node-head{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.node-num{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:11px;flex:none}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:10px;
  font-size:14.5px;color:var(--text);transition:.13s;margin-bottom:1px}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-item .dot{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none;transition:.2s}
.nav-item.done .dot{background:var(--ok)}
.nav-item span{flex:1;min-width:0}
.nav-special{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;
  border-radius:11px;padding:11px 13px;width:100%;text-align:left;margin-bottom:10px;font-size:14.5px}

/* ---------- CONTENT ---------- */
.crumb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin-bottom:6px}
h1.topic-title{font-size:clamp(22px,5.5vw,30px);line-height:1.25;margin:0 0 6px;letter-spacing:-.6px;font-weight:800}
.topic-sub{color:var(--muted);font-size:15px;margin:0 0 18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.card h3 .ico{font-size:16px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 4px;padding-left:20px}
.card li{margin-bottom:5px}
b,strong{font-weight:700}
code,.k{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;font-weight:600}

.formula{background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px dashed var(--accent);
  border-radius:11px;padding:12px 14px;font-weight:700;text-align:center;margin:0 0 12px;font-size:15px;
  overflow-x:auto;white-space:nowrap}
.formula:last-child{margin-bottom:0}

.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:11px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th{background:var(--surface2);text-align:left;padding:10px 12px;font-weight:700;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr td:first-child{font-weight:600}

.ex{border-left:3px solid var(--accent-2);padding:8px 0 8px 12px;margin-bottom:11px}
.ex:last-child{margin-bottom:0}
.ex .en{font-weight:600;margin-bottom:2px}
.ex .tr{color:var(--muted);font-size:14.5px}
.hl{background:linear-gradient(transparent 58%,rgba(13,148,136,.28) 58%);font-weight:800;padding:0 1px}

.note{border-radius:11px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;border:1px solid}
.note:last-child{margin-bottom:0}
.note b.lbl{display:block;margin-bottom:3px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.note.tip{background:var(--ok-soft);border-color:transparent;color:var(--text)}
.note.tip b.lbl{color:var(--ok)}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.warn b.lbl{color:var(--warn)}
.note.err{background:var(--err-soft);border-color:transparent}
.note.err b.lbl{color:var(--err)}

/* ---------- QUIZ ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.q-num{font-size:11.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.q-text{font-weight:600;margin-bottom:12px;font-size:15.5px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
  margin-bottom:8px;background:var(--surface);transition:.15s;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.q-exp{display:none;margin-top:6px;padding:11px 13px;border-radius:10px;background:var(--surface2);font-size:14.5px}
.q-exp.show{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:11px;
  font-weight:700;font-size:15px;transition:.15s;border:1px solid var(--line);background:var(--surface)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.done-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- HOME ---------- */
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:18px;
  padding:26px 22px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(23px,6vw,32px);letter-spacing:-.7px;line-height:1.2}
.hero p{margin:0;opacity:.92;font-size:15px;max-width:52ch}
.node-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.node-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);text-align:left;width:100%;transition:.15s}
.node-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.node-card h4{margin:8px 0 5px;font-size:16px;font-weight:800;letter-spacing:-.3px}
.node-card p{margin:0;color:var(--muted);font-size:14px}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:99px;letter-spacing:.5px}

.res-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;margin-bottom:8px}
.res-item:hover{border-color:var(--accent)}
.res-item .t{font-weight:700}
.res-item .n{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* ---------- SCORE ---------- */
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.score .big{font-size:clamp(22px,6vw,36px);font-weight:800;letter-spacing:-1px;line-height:1.2;word-break:break-word}

/* ---------- KELİME HAZİNESİ ---------- */
.vprog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.vprog .ln{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
.vprog .ln b{color:var(--accent)}
.vtabs{display:flex;gap:6px;margin-bottom:14px}
.vtab{flex:1;padding:10px 6px;border-radius:11px;font-size:14px;font-weight:700;text-align:center;
  background:var(--surface2);border:1px solid var(--line);transition:.15s}
.vtab.on{background:var(--accent);color:#fff;border-color:transparent}
.vsearch{margin-bottom:10px}
.vsearch input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;outline:none}
.vsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vchip{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;
  background:var(--surface2);border:1px solid var(--line)}
.vchip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.vchip i{font-style:normal;opacity:.55;font-size:11.5px;margin-left:2px}
.vcount{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.valpha{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin:14px 0 6px;padding-left:2px}
.vrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 13px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:6px;transition:.13s}
.vrow:hover{border-color:var(--accent)}
.vrow.done{background:var(--ok-soft)}
.vrow .vw{font-weight:700;font-size:15px;flex:none}
.vrow .vtr{color:var(--muted);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vstar{color:var(--accent-2);font-size:9px;flex:none}
.vpos{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;flex:none;
  background:var(--surface2);color:var(--muted);letter-spacing:.3px}
.vpos.pi{background:rgba(79,70,229,.14);color:#4f46e5}
.vpos.pf{background:rgba(13,148,136,.16);color:#0d9488}
.vpos.ps{background:rgba(217,119,6,.16);color:#b45309}
.vpos.pz{background:rgba(124,58,237,.15);color:#7c3aed}
.vpos.pp{background:rgba(225,29,72,.14);color:#e11d48}
.vpos.pm{background:rgba(8,145,178,.15);color:#0891b2}
html[data-theme="dark"] .vpos.pi{color:#a5a4ff}
html[data-theme="dark"] .vpos.pf{color:#2dd4bf}
html[data-theme="dark"] .vpos.ps{color:#fbbf24}
html[data-theme="dark"] .vpos.pz{color:#c4b5fd}
html[data-theme="dark"] .vpos.pp{color:#fb7185}
html[data-theme="dark"] .vpos.pm{color:#67e8f9}

.vhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.vhw{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-bottom:7px}
.vhtr{font-size:16px;color:var(--muted);margin-top:8px}
.vh3{margin:20px 0 9px;font-size:16px;font-weight:800}
.vh3 .vsub{font-size:12.5px;font-weight:600;color:var(--muted)}
.vfrow{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.vfrow:first-child{border-top:none}
.vfrow .vw{font-weight:700;font-size:14.5px}
.vfrow .vtr{color:var(--muted);font-size:14px;flex:1;min-width:120px}

.vcprog{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px;text-align:center}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:30px 20px;
  min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.fcard:active{transform:scale(.99)}
.fw{font-size:clamp(26px,8vw,38px);font-weight:800;letter-spacing:-1px;line-height:1.2}
.fpos{margin-top:10px}
.ftr{margin-top:18px;font-size:19px;font-weight:700;color:var(--accent)}
.ffs{margin-top:12px;font-size:13.5px;color:var(--muted);line-height:1.7}
.ffs i{color:var(--text);font-style:normal}
.fex{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.fex i{color:var(--muted);font-style:normal}
.fhint{margin-top:20px;font-size:13px;color:var(--muted)}

/* ---------- DİNLEME PRATİĞİ ---------- */
.lcount{background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:800;
  padding:2px 8px;border-radius:99px;margin-left:2px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vcard{background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vplayer-box{position:relative;width:100%;background:#000}
.vthumb{display:block;width:100%;aspect-ratio:16/9;position:relative;padding:0;border:none;background:none;line-height:0;cursor:pointer}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;
  border-radius:99px;background:rgba(0,0,0,.68);color:#fff;display:grid;place-items:center;font-size:17px;
  transition:.15s;pointer-events:none}
.vthumb:hover .vplay{background:#e11d48;transform:translate(-50%,-50%) scale(1.1)}
.vplay-lbl{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);
  color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;pointer-events:none}
.vframe{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmeta{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.vt{font-weight:700;font-size:14px;line-height:1.35}
.vlinks{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;margin-top:auto}
.btn-play-inline{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;transition:.15s}
.btn-play-inline:hover{filter:brightness(1.1)}
.yt-link-subtle{color:var(--muted);text-decoration:none;font-size:12px;margin-left:auto}
.yt-link-subtle:hover{color:var(--accent);text-decoration:underline}
.v-file-notice{background:rgba(245,158,11,.1);border-top:1px solid rgba(245,158,11,.25);padding:7px 10px;font-size:11.5px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:6px}
.v-file-notice a{color:var(--accent);font-weight:700;text-decoration:underline;white-space:nowrap}
.vdel{color:var(--err);font-size:12px;font-weight:600;padding:0;background:none;border:none;cursor:pointer}
.ladd{margin-top:11px;padding:12px;background:var(--surface2);border-radius:11px}
.ladd input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:15px}
.lname{font-weight:700;font-size:14px;margin:8px 0 5px}
audio.lau{width:100%;margin-bottom:6px}
.playlist-box{background:linear-gradient(135deg,rgba(79,70,229,.07),rgba(225,29,72,.07));border:1.5px solid var(--accent);border-radius:14px;padding:15px;margin-bottom:16px}
.playlist-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.playlist-title{font-size:15.5px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px}
.playlist-desc{font-size:12.5px;color:var(--muted);margin:3px 0 0;line-height:1.4}
.playlist-ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.playlist-ctrls .btn{padding:7px 14px;font-size:13px}
.btn-yt{display:inline-flex;align-items:center;gap:6px;background:#cc0000;color:#fff!important;border:none;border-radius:8px;font-weight:700;cursor:pointer;transition:.15s;text-decoration:none}
.btn-yt:hover{background:#b20000;color:#fff}
.mobile-yt-hint{background:rgba(204,0,0,.06);border-left:3px solid #cc0000;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:12px;color:var(--text);line-height:1.45}
.playlist-queue{margin-top:12px;max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px}
.queue-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:.15s}
.queue-item:hover{background:var(--surface2)}
.queue-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.queue-num{font-weight:800;font-size:11px;color:var(--muted);width:22px;flex:none}
.queue-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-topic{font-size:11px;color:var(--muted);flex:none}
.lhub-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.lhub-row:first-child{border-top:none}
.lhub-row .hn{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.lhub-row .hc{font-size:12px;color:var(--muted);flex:none}

/* ---------- GENEL DEĞERLENDİRME ---------- */
.ex-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:14px;box-shadow:var(--shadow)}
.ex-head .ln{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.ex-head .ln b{color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.ex-nav{display:flex;gap:10px;margin-top:14px}
.ex-nav .btn{flex:1}
.ex-topic{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.res-big{font-size:clamp(40px,12vw,58px);font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:4px}
.res-pct{font-size:15px;color:var(--muted)}
.nrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.nrow:first-child{border-top:none}
.nrow .nn{flex:1;min-width:0}
.nrow .nb{width:76px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:none}
.nrow .nb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.nrow .ns{width:46px;text-align:right;font-weight:800;font-size:13px;flex:none}
.wrong{border-left:3px solid var(--err);background:var(--surface2);border-radius:0 10px 10px 0;
  padding:11px 13px;margin-bottom:9px;font-size:14.5px}
.wrong .wq{font-weight:700;margin-bottom:6px}
.wrong .wa{font-size:13.5px;margin-bottom:3px}
.wrong .wa s{color:var(--err)}
.wrong .wa b{color:var(--ok)}

.backdrop{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  background:rgba(0,0,0,.5);z-index:900;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-tap-highlight-color:transparent;
}
.backdrop.show{display:block}
.nav-drawer-hdr{display:none}

/* ---------- RESPONSIVE / MOBILE ---------- */
@media(max-width:900px){
  #menuBtn{display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .wrap{display:block;width:100%;max-width:100%}
  .nav-drawer-hdr{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);
  }
  nav{
    position:fixed;top:0;left:0;bottom:0;height:100%;height:100dvh;width:min(85vw,320px);
    z-index:1000;background:var(--surface);
    transform:translate3d(-105%,0,0);-webkit-transform:translate3d(-105%,0,0);
    transition:transform .25s cubic-bezier(.25,.8,.25,1),-webkit-transform .25s cubic-bezier(.25,.8,.25,1);
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 36px);
    box-shadow:none;display:flex;flex-direction:column;
    overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;pointer-events:none;
  }
  nav.open{
    transform:translate3d(0,0,0) !important;-webkit-transform:translate3d(0,0,0) !important;
    box-shadow:6px 0 25px rgba(0,0,0,.3);visibility:visible;pointer-events:auto;
  }
  main{padding:16px 14px calc(env(safe-area-inset-bottom) + 85px);min-width:0;width:100%}
  .card,.q{padding:14px}
  body{font-size:15.5px}
}
@media(min-width:901px){ .backdrop{display:none!important} }

@media(max-width:600px){
  main{padding:14px 12px calc(env(safe-area-inset-bottom) + 85px)}
  .card,.q{padding:13px;border-radius:12px;margin-bottom:11px}
  .crumb{font-size:11.5px}
  h1.topic-title{font-size:clamp(20px,5.8vw,26px)}
  .hero{padding:20px 15px;border-radius:14px;margin-bottom:14px}
  .hero h1{font-size:clamp(20px,6vw,26px)}
  .node-cards{grid-template-columns:1fr;gap:10px}
  .task-grid{grid-template-columns:1fr;gap:8px}

  /* Formüller mobilde taşmadan alt satıra geçebilsin */
  .formula{
    white-space:normal;word-break:break-word;font-size:14px;
    padding:10px 12px;line-height:1.6;
  }

  /* Tablolar mobilde daha kompakt ve kaydırılabilir */
  table{font-size:13px;min-width:300px}
  th,td{padding:8px 10px}

  /* Konu tamamlama ve navigasyon butonları */
  .done-bar{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .done-bar #markDone{
    grid-column:1 / -1;width:100%;
  }
  .done-bar button[data-go]{
    width:100%;padding:11px 8px;font-size:14px;
  }

  /* Buton grupları tek sütun */
  .btn-row{flex-direction:column;gap:8px}
  .btn-row .btn{width:100%}

  /* Quiz şıkları daha dokunmatik dostu */
  .opt{padding:12px;font-size:14.5px;min-height:46px}

  /* Skor kutusu */
  .score{padding:16px 12px}

  /* Yazma atölyesi sayaç */
  .counter{gap:8px;font-size:13px}
  .cbar{min-width:100%;width:100%;order:3}

  /* Cümle analizleri */
  .sent{font-size:13.5px;gap:7px}
  .sent .sn{width:22px;height:22px;font-size:11px}
  .sent .sw{font-size:11px}
}

/* ---------- WRITING STUDIO ---------- */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-bottom:16px}
.task-btn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px;text-align:left;transition:.15s}
.task-btn:hover{border-color:var(--accent)}
.task-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.task-btn .tt{font-weight:700;font-size:14.5px;margin-bottom:2px}
.task-btn .td{font-size:12.5px;color:var(--muted);line-height:1.45}

.editor-wrap{position:relative}
textarea#draft{
  width:100%;min-height:230px;padding:14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;line-height:1.7;resize:vertical;outline:none;
  font-family:inherit;transition:.15s}
textarea#draft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.counter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:9px 0 12px;font-size:13.5px;color:var(--muted)}
.counter b{color:var(--text);font-size:15px}
.cbar{flex:1;min-width:110px;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:var(--warn);transition:.3s}
.cbar i.ok{background:var(--ok)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px}
.chip.link{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}

.find{border-left:3px solid;border-radius:0 10px 10px 0;background:var(--surface2);padding:10px 13px;margin-bottom:9px;font-size:14.5px}
.find.err{border-color:var(--err)}
.find.warn{border-color:var(--warn)}
.find.tip{border-color:var(--accent-2)}
.find .fh{font-weight:700;margin-bottom:3px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.find .badge2{font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:99px;text-transform:uppercase}
.find.err .badge2{background:var(--err-soft);color:var(--err)}
.find.warn .badge2{background:var(--warn-soft);color:var(--warn)}
.find.tip .badge2{background:var(--accent-soft);color:var(--accent)}
.find .frag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--err-soft);padding:1px 6px;border-radius:5px}
.find .fix{margin-top:5px;font-size:14px}
.find .fix b{color:var(--ok)}

.preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;
  line-height:2;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
mark.mk{border-radius:4px;padding:1px 3px;color:inherit}
mark.mk.err{background:rgba(220,38,38,.22);box-shadow:inset 0 -2px 0 var(--err)}
mark.mk.warn{background:rgba(217,119,6,.22);box-shadow:inset 0 -2px 0 var(--warn)}
mark.mk.tip{background:rgba(13,148,136,.18);box-shadow:inset 0 -2px 0 var(--accent-2)}
mark.mk.fixd{background:rgba(22,163,74,.22);box-shadow:inset 0 -2px 0 var(--ok);font-weight:700}

.sent{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.sent:first-child{border-top:none}
.sent .sn{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--muted)}
.sent.bad .sn{background:var(--err-soft);color:var(--err)}
.sent.good .sn{background:var(--ok-soft);color:var(--ok)}
.sent .sw{flex:none;font-size:12px;color:var(--muted);align-self:center}

.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:14.5px}
.chk input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.model{display:none}
.model.show{display:block}

.toggle-row{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);
  border-radius:11px;margin-top:12px;cursor:pointer;transition:.15s}
.toggle-row:hover{border-color:var(--accent-2)}
.toggle-row.on{border-color:var(--accent-2);background:rgba(13,148,136,.07)}
.toggle-row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent-2);flex:none}
.toggle-row .tl{font-weight:700;font-size:14.5px;margin-bottom:3px}
.toggle-row .ts{font-size:13px;color:var(--muted);line-height:1.5}
.src{font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:99px;
  background:var(--surface2);color:var(--muted);text-transform:uppercase}
.src.online{background:rgba(13,148,136,.16);color:var(--accent-2)}
.src.ai{background:var(--accent-soft);color:var(--accent)}
.keyrow{margin-top:10px;font-size:13px;color:var(--muted)}
.keyrow summary{cursor:pointer;font-weight:600;color:var(--accent)}
.keyrow input{width:100%;margin-top:8px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
/* ---------- KELİME SÖZLÜĞÜ ---------- */
.w{border-bottom:1px dotted var(--muted);cursor:help}
.w:hover,.w.act{background:var(--accent-soft);border-radius:3px;border-bottom-color:var(--accent)}
#wtip{position:fixed;z-index:200;max-width:min(290px,88vw);background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:0 10px 34px rgba(16,24,40,.22);
  font-size:14px;line-height:1.5;display:none;pointer-events:auto}
html[data-theme="dark"] #wtip{box-shadow:0 10px 34px rgba(0,0,0,.55)}
#wtip.show{display:block}
#wtip .ww{font-weight:800;font-size:15.5px}
#wtip .wb{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px}
#wtip .wt{margin-top:4px}
#wtip .wn{margin-top:5px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:5px}
.gloss-hint{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.55}
.gloss-hint b{border-bottom:1px dotted var(--muted);color:var(--text)}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- GÖRSEL ANLATIM PANELİ ---------- */
details.viz{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
details.viz>summary{padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:9px;user-select:none}
details.viz>summary::-webkit-details-marker{display:none}
details.viz>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:.2s;font-size:13px}
details.viz[open]>summary::after{transform:rotate(180deg)}
details.viz>summary:hover{background:var(--surface2)}
.viz-body{padding:0 14px 15px}
.viz-cap{font-size:14.5px;color:var(--muted);margin:2px 0 0;line-height:1.55}
.viz-cap b{color:var(--text)}
.viz-ex{margin-top:11px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14.5px}
.viz-ex .en{font-weight:700}
.viz-ex .tr{color:var(--muted);font-size:13.5px}
.viz-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Daima kaba sığar (yatay kaydırma yok); masaüstünde aşırı büyümemesi için sınırlı */
svg.vz{display:block;width:100%;max-width:560px;margin:0 auto;height:auto;font-family:inherit}

svg.vz .ax{stroke:var(--line);stroke-width:2}
svg.vz .axf{fill:var(--line)}
svg.vz .nw{stroke:var(--accent);stroke-width:2;opacity:.85}
svg.vz .tx{fill:var(--muted);font-size:20px;font-weight:600}
svg.vz .tn{fill:var(--accent);font-size:20px;font-weight:800}
svg.vz .lb{fill:var(--text);font-size:22px;font-weight:700}
svg.vz .lbs{fill:var(--muted);font-size:19px;font-weight:600}
svg.vz .dot{fill:var(--accent)}
svg.vz .dot2{fill:var(--accent-2)}
svg.vz .bar{fill:var(--accent);opacity:.42}
svg.vz .span{fill:var(--accent-2);opacity:.26}
svg.vz .bx{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
svg.vz .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg.vz .arw{stroke:var(--accent);stroke-width:2.5;fill:none}
svg.vz .arwf{fill:var(--accent)}
svg.vz .neg{fill:var(--err)}
svg.vz .pos{fill:var(--ok)}
svg.vz .xs{stroke:var(--err);stroke-width:3}
svg.vz .blob{fill:var(--accent-2);opacity:.32}

svg.vz .nwq{stroke:var(--muted);stroke-width:1.5;opacity:.42}   /* sönük ŞİMDİ çizgisi */
svg.vz .ul{fill:var(--accent)}                                   /* yazının altındaki renk şeridi */
svg.vz .ul2{fill:var(--accent-2)}
svg.vz .lbm{fill:var(--text);font-size:19px;font-weight:700}
svg.vz .ghost{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:8 7;opacity:.85}
svg.vz .solid{fill:var(--accent);opacity:.34;stroke:var(--accent);stroke-width:2}
svg.vz .stopbar{fill:var(--err)}
svg.vz .chip{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
svg.vz .chipt{fill:var(--accent);font-size:21px;font-weight:800}

svg.vz .an{opacity:0;animation:vzIn .42s ease forwards}
svg.vz .grow{transform-box:fill-box;transform-origin:left center;animation:vzGrow .62s cubic-bezier(.3,.9,.3,1) forwards}
svg.vz .pop{transform-box:fill-box;transform-origin:center;animation:vzPop .46s cubic-bezier(.34,1.56,.64,1) both}
svg.vz .draw{stroke-dasharray:260;stroke-dashoffset:260;animation:vzDraw .7s ease forwards}
@keyframes vzIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes vzGrow{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@keyframes vzPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes vzDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  svg.vz .an,svg.vz .grow,svg.vz .pop,svg.vz .draw{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
}


.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:50;
  background:var(--accent);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;
  box-shadow:0 8px 24px rgba(79,70,229,.4);display:none;align-items:center;gap:6px;font-size:14.5px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fab:active{transform:scale(.95)}
</style>

<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menü">☰</button>
  <div class="brand"><div class="logo">A2</div><span>Gramer Haritası</span></div>
  <div class="hdr-actions">
    <button class="icon-btn" id="homeBtn" title="Ana sayfa" aria-label="Ana sayfa">⌂</button>
    <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Tema">◐</button>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>

<div class="wrap">
  <nav id="nav">
    <div class="nav-drawer-hdr">
      <div class="brand"><div class="logo">A2</div><span>Gramer Haritası</span></div>
      <button class="icon-btn" id="navCloseBtn" aria-label="Menüyü Kapat" title="Kapat">✕</button>
    </div>
    <div class="search-box"><input id="search" type="search" placeholder="Konu ara... (ör. must)" autocomplete="off"></div>
    <div class="prog-wrap">
      <div class="prog-top"><span>İlerleme</span><span id="progTxt">0 / 0</span></div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    </div>
    <button class="nav-special" id="writeBtn" style="background:linear-gradient(135deg,var(--accent-2),var(--accent))">✎ &nbsp;Yazma Atölyesi</button>
    <button class="nav-special" id="bigQuizBtn">◎ &nbsp;Karışık Test (25 soru)</button>
    <button class="nav-special" id="examBtn" style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">🎓 &nbsp;Genel Değerlendirme (24 soru)</button>
    <button class="nav-special" id="vocabBtn" style="background:linear-gradient(135deg,#0891b2,#0d9488)">📚 &nbsp;Kelime Hazinesi</button>

<script>
/* =====================================================================
   VERİ: A2 gramer konuları
   s = bölümler  |  t: p | f(formül) | tbl | ex | tip | warn | err | ul
   ===================================================================== */
var NODES = [
  {n:1, title:"Temporal Framework", sub:"Zaman Çerçevesi — Eylemin Vakti", ico:"◷"},
  {n:2, title:"Semantic Modifiers", sub:"Anlamsal Nüanslar — Eylemin Tonu & Koşulu", ico:"◈"},
  {n:3, title:"Quantitative Operators", sub:"Miktar ve Hacim Belirteçleri", ico:"▦"},
  {n:4, title:"Verb Complementation", sub:"Fiil Bağlantıları & Akış", ico:"⇄"},
  {n:5, title:"Spatial Relations", sub:"Yer ve Yön Edatları — Nerede & Nereye", ico:"⌖"}
];

var T = [

/* ============================ DÜĞÜM 1 ============================ */
{
id:"simple-present", node:1, title:"Simple Present", sub:"Geniş Zaman — Rutinler, genel kurallar, olgular",
s:[
 {t:"p", x:"Simple Present, <b>her zaman doğru olan</b> veya <b>düzenli olarak tekrarlanan</b> eylemleri anlatır. Türkçedeki geniş zamanın (-ır/-er) karşılığıdır. Eylemin şu anda oluyor olması gerekmez; önemli olan bunun bir <b>alışkanlık, kural ya da gerçek</b> olmasıdır."},
 {t:"ul", items:[
   "<b>Rutinler / alışkanlıklar:</b> I get up at seven every day.",
   "<b>Genel gerçekler / olgular:</b> Water boils at 100 degrees.",
   "<b>Kurallar ve tarifeler:</b> The library closes at 6 p.m.",
   "<b>Kalıcı durumlar:</b> She lives in Ankara.",
   "<b>Duygu ve düşünceler:</b> I like coffee. / He knows the answer."
 ]},
 {t:"h", x:"Cümle Yapısı"},
 {t:"f", x:"(+) I / You / We / They + V1 &nbsp;•&nbsp; He / She / It + V1-<b>s</b>"},
 {t:"f", x:"(−) Özne + <b>don't / doesn't</b> + V1 &nbsp;&nbsp; (?) <b>Do / Does</b> + Özne + V1 ?"},
 {t:"tbl", head:["Özne","Olumlu","Olumsuz","Soru"], rows:[
   ["I / You / We / They","I <b>work</b> here.","I <b>don't work</b> here.","<b>Do</b> you <b>work</b> here?"],
   ["He / She / It","She <b>works</b> here.","She <b>doesn't work</b> here.","<b>Does</b> she <b>work</b> here?"],

var LS_KEY = "a2gram_done_v1", THEME_KEY = "a2gram_theme_v1";
var done = {};
try { done = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch(e){ done = {}; }
function saveDone(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(done)); }catch(e){} }

var el = function(id){ return document.getElementById(id); };
var main = el("main"), nav = el("nav"), navList = el("navList"), backdrop = el("backdrop"), fab = el("fabNext");
var current = null;

/* ---------- Tema ---------- */
(function(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(!saved) saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", saved);
})();
el("themeBtn").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
};

/* ---------- Menü ---------- */
function openNav(e){
  if(e){ if(e.preventDefault) e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); }
  nav.classList.add("open");
  backdrop.classList.add("show");
  document.documentElement.classList.add("nav-open");
}
function closeNav(e){
  if(e && e.preventDefault) e.preventDefault();
  nav.classList.remove("open");
  backdrop.classList.remove("show");
  document.documentElement.classList.remove("nav-open");
}
var menuBtn = el("menuBtn");
if(menuBtn){
  menuBtn.onclick = openNav;
  menuBtn.ontouchend = function(e){ e.preventDefault(); openNav(e); };
}
if(backdrop){
  backdrop.onclick = closeNav;
  backdrop.ontouchend = function(e){ e.preventDefault(); closeNav(e); };
}
var navCloseBtn = el("navCloseBtn");
if(navCloseBtn){
  navCloseBtn.onclick = closeNav;
  navCloseBtn.ontouchend = function(e){ e.preventDefault(); closeNav(e); };
}

/* ---------- Escape ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- Navigasyon listesi ---------- */
function buildNav(filter){
  filter = (filter||"").trim().toLowerCase();
  var html = "";
  NODES.forEach(function(nd){
    var items = T.filter(function(t){
      if(t.node !== nd.n) return false;
      if(!filter) return true;
      var hay = (t.title + " " + t.sub + " " + JSON.stringify(t.s)).toLowerCase();
      return hay.indexOf(filter) > -1;
    });
    if(!items.length) return;
    html += '<div class="node-group"><div class="node-head"><span class="node-num">'+nd.n+'</span><span>'+nd.title+'</span></div>';
    items.forEach(function(t){
      html += '<button class="nav-item'+(done[t.id]?" done":"")+(current===t.id?" active":"")+'" data-go="'+t.id+'">'+
              '<i class="dot"></i><span>'+esc(t.title)+'</span></button>';
    });
    html += '</div>';
  });
  if(!html) html = '<div class="empty">Sonuç bulunamadı.</div>';
  navList.innerHTML = html;
  updateProgress();
}
function updateProgress(){
  var total = T.length, d = 0;
  T.forEach(function(t){ if(done[t.id]) d++; });
  el("progTxt").textContent = d + " / " + total;
  el("progFill").style.width = (total ? (d/total*100) : 0) + "%";
}

/* ---------- Bölüm render ---------- */
function renderSections(secs){
  var out = "", buf = "", open = false;
  function flush(){ if(open){ out += '<div class="card">'+buf+'</div>'; buf=""; open=false; } }
  secs.forEach(function(s){
    if(s.t === "h"){ flush(); open = true; buf += '<h3><span class="ico">◆</span>'+s.x+'</h3>'; return; }
    if(!open){ open = true; }
    if(s.t === "p") buf += '<p>'+s.x+'</p>';
    else if(s.t === "f") buf += '<div class="formula">'+s.x+'</div>';
    else if(s.t === "ul"){ buf += '<ul>'+s.items.map(function(i){return '<li>'+i+'</li>';}).join("")+'</ul>'; }
    else if(s.t === "tbl"){
      var h = '<div class="tbl-scroll"><table><thead><tr>'+s.head.map(function(x){return '<th>'+x+'</th>';}).join("")+'</tr></thead><tbody>';
      s.rows.forEach(function(r){ h += '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join("")+'</tr>'; });
      buf += h + '</tbody></table></div>';
    }
    else if(s.t === "ex"){
      buf += s.items.map(function(p){ return '<div class="ex"><div class="en">'+p[0]+'</div><div class="tr">'+p[1]+'</div></div>'; }).join("");
    }
    else if(s.t === "tip") buf += '<div class="note tip"><b class="lbl">'+(s.lbl||"İpucu")+'</b>'+s.x+'</div>';
    else if(s.t === "warn") buf += '<div class="note warn"><b class="lbl">'+(s.lbl||"Dikkat")+'</b>'+s.x+'</div>';
    else if(s.t === "err") buf += '<div class="note err"><b class="lbl">'+(s.lbl||"Hata")+'</b>'+s.x+'</div>';
  });
  flush();
  return out;
}

/* ---------- Quiz render ---------- */
function renderQuiz(qs, prefix){
  var h = '<h3 style="margin:24px 0 12px;font-size:18px;font-weight:800;">◎ Alıştırma</h3>';
  qs.forEach(function(q, i){
    h += '<div class="q" data-q="'+prefix+i+'"><div class="q-num">Soru '+(i+1)+'</div>'+
         '<div class="q-text">'+esc(q.q).replace(/___/g,'<span class="k">_____</span>')+'</div>';
    q.o.forEach(function(o, j){
      h += '<button class="opt" data-qi="'+i+'" data-oi="'+j+'">'+String.fromCharCode(65+j)+') '+esc(o)+'</button>';
    });
    h += '<div class="q-exp"></div></div>';
  });
  return h;
}
function wireQuiz(root, qs, onAnswer){
  root.querySelectorAll(".opt").forEach(function(btn){
    btn.onclick = function(){
      var qi = +btn.getAttribute("data-qi"), oi = +btn.getAttribute("data-oi");
      var box = btn.closest(".q");
      if(box.dataset.answered) return;
      box.dataset.answered = "1";
      var correct = qs[qi].a;
      box.querySelectorAll(".opt").forEach(function(b,k){
        b.disabled = true;
        if(k === correct) b.classList.add("correct");
        else if(k === oi) b.classList.add("wrong");
      });
      var exp = box.querySelector(".q-exp");
      exp.innerHTML = (oi===correct ? "<b>✓ Doğru!</b> " : "<b>✗ Yanlış.</b> Doğru cevap: <b>"+esc(qs[qi].o[correct])+"</b>. ") + qs[qi].e;
      exp.classList.add("show");
      if(onAnswer) onAnswer(oi === correct);
    };
  });
}

/* ---------- Konu sayfası ---------- */
/* =====================================================================
   GÖRSEL ANLATIM MOTORU
   Her konu için tek bir görsel tipi + tanım. Kalıp değil, veri:
   timeline (zaman çizelgesi) · scale (ölçek) · flow (akış) ·
   split (dallanma) · qty (miktar çubukları) · count (sayılabilirlik)
   ===================================================================== */
var VZ = {};   /* topicId -> spec */

function vzWrap(inner, w, h){
  return '<div class="viz-scroll"><svg class="vz" viewBox="0 0 ' + w + ' ' + h + '" role="img">' + inner + '</svg></div>';
}
function an(i){ return ' class="an" style="animation-delay:' + (0.10 + i * 0.13) + 's"'; }

/* ---------- 1) ZAMAN ÇİZELGESİ ---------- */
function vzTimeline(sp){
  var x0 = 46, x1 = 566, ay = 118;
  function X(f){ return Math.round(x0 + f * (x1 - x0)); }
  var s = '';
  s += '<line class="ax" x1="' + x0 + '" y1="' + ay + '" x2="' + x1 + '" y2="' + ay + '"/>';
  s += '<polygon class="axf" points="' + x1 + ',' + ay + ' ' + (x1-11) + ',' + (ay-5.5) + ' ' + (x1-11) + ',' + (ay+5.5) + '"/>';
  /* ŞİMDİ çizgisi yalnızca bir referans — konu "now" değilse öne çıkmasın */
  var fc = sp.focus || "";
  function zc(z){ return fc.indexOf(z) >= 0 ? "tn" : "tx"; }
  s += '<line class="' + (fc.indexOf("now") >= 0 ? "nw" : "nwq") + '" x1="' + X(0.5) +
       '" y1="40" x2="' + X(0.5) + '" y2="140" stroke-dasharray="5 5"/>';
  s += '<text class="' + zc("past")   + '" x="' + X(0.14) + '" y="166" text-anchor="middle">PAST · geçmiş</text>';
  s += '<text class="' + zc("now")    + '" x="' + X(0.5)  + '" y="166" text-anchor="middle">NOW · şimdi</text>';
  s += '<text class="' + zc("future") + '" x="' + X(0.87) + '" y="166" text-anchor="middle">FUTURE · gelecek</text>';

  (sp.marks || []).forEach(function(m, i){
    var g = '<g' + an(i) + '>';
    var d = ' style="animation-delay:' + (0.16 + i * 0.15) + 's"';
    if(m.k === "dot"){
      g += '<circle class="' + (m.c || "dot") + ' pop"' + d + ' cx="' + X(m.at) + '" cy="' + ay + '" r="9"/>';
    } else if(m.k === "dots"){
      var n = m.n || 5;
      for(var j = 0; j < n; j++){
        var f = m.from + (m.to - m.from) * (n === 1 ? 0 : j / (n - 1));
        g += '<circle class="dot pop" style="animation-delay:' + (0.16 + i*0.15 + j*0.07) + 's" cx="' +
             X(f) + '" cy="' + ay + '" r="6.5"/>';
      }
    } else if(m.k === "bar"){
      g += '<rect class="' + (m.c || "bar") + ' grow"' + d + ' x="' + X(m.from) + '" y="' + (ay-13) + '" width="' +
           (X(m.to) - X(m.from)) + '" height="26" rx="13"/>';
    } else if(m.k === "span"){
      g += '<rect class="span grow"' + d + ' x="' + X(m.from) + '" y="' + (ay-13) + '" width="' +
           (X(m.to) - X(m.from)) + '" height="26" rx="13"/>';
      g += '<polygon class="dot2 pop" style="animation-delay:' + (0.16 + i*0.15 + 0.45) + 's" points="' +
           X(m.to) + ',' + ay + ' ' + (X(m.to)-13) + ',' + (ay-8) + ' ' + (X(m.to)-13) + ',' + (ay+8) + '"/>';
    } else if(m.k === "flag"){
      g += '<line class="arw draw"' + d + ' x1="' + X(m.at) + '" y1="' + ay + '" x2="' + X(m.at) + '" y2="' + (ay-34) + '"/>';
      g += '<circle class="dot pop"' + d + ' cx="' + X(m.at) + '" cy="' + ay + '" r="6"/>';
    } else if(m.k === "cross"){
      var cx = X(m.at);
      g += '<line class="xs" x1="' + (cx-8) + '" y1="' + (ay-8) + '" x2="' + (cx+8) + '" y2="' + (ay+8) + '"/>';
      g += '<line class="xs" x1="' + (cx+8) + '" y1="' + (ay-8) + '" x2="' + (cx-8) + '" y2="' + (ay+8) + '"/>';
    } else if(m.k === "arrow"){
      g += '<line class="arw draw"' + d + ' x1="' + X(m.from) + '" y1="' + (ay-40) + '" x2="' + (X(m.to)-10) + '" y2="' + (ay-40) + '"/>';
      g += '<polygon class="arwf pop" style="animation-delay:' + (0.16 + i*0.15 + 0.4) + 's" points="' +
           X(m.to) + ',' + (ay-40) + ' ' + (X(m.to)-11) + ',' + (ay-45.5) + ' ' + (X(m.to)-11) + ',' + (ay-34.5) + '"/>';
    }
    if(m.lb){
      var lx = X(m.k === "bar" || m.k === "span" || m.k === "dots" || m.k === "arrow"
                ? (m.from + m.to) / 2 : m.at);
      /* etiketler daima eksen bandının ÜSTÜNDE kalsın — çubuk/nokta ile çakışmasın.
         m.ly verilirse etiket eksenden o kadar yukarıya konur: aynı x'te duran
         iki işaretin etiketleri farklı satırlara yerleşsin diye. */
      var ly = m.ly ? ay - m.ly
             : m.k === "arrow" ? ay - 58 : m.k === "flag" ? ay - 48 : ay - 46;
      g += '<text class="lb" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + m.lb + '</text>';
      if(m.sub) g += '<text class="lbs" x="' + lx + '" y="' + (ly + 20) + '" text-anchor="middle">' + m.sub + '</text>';
    }
    s += g + '</g>';
  });
  return vzWrap(s, 612, 178);
}

/* ---------- 2) ÖLÇEK (olasılık / zorunluluk derecesi) ---------- */
function vzScale(sp){
  /* Etiketler dönüşümlü olarak çubuğun üstünde ve altında; ikisi de bara değmez. */
  var by = 108, bh = 18;
  var stops = sp.stops || [];
  /* uçtaki etiketler kırpılmasın diye kenar boşluğu bırak */
  var x0 = 92, x1 = 520;
  function X(f){ return Math.round(x0 + f * (x1 - x0)); }
  var s = '';
  s += '<defs><linearGradient id="vzg' + (sp.gid || 0) + '" x1="0" x2="1">' +
       '<stop offset="0" stop-color="var(--line)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>';
  s += '<rect class="grow" style="animation-delay:.08s" x="' + x0 + '" y="' + by + '" width="' + (x1-x0) +
       '" height="' + bh + '" rx="' + (bh/2) + '" fill="url(#vzg' + (sp.gid || 0) + ')"/>';
  /* uç etiketleri viewBox içinde kalsın: sola yapışık başlat, sağa yapışık bitir */
  s += '<text class="tx" x="6" y="' + (by + bh + 6) + '">' + (sp.lo || "zayıf") + '</text>';
  s += '<text class="tx" x="606" y="' + (by + bh + 6) + '" text-anchor="end">' + (sp.hi || "güçlü") + '</text>';
  stops.forEach(function(st, i){
    var x = X(st.f), up = i % 2 === 0;
    var g = '<g' + an(i) + '>';
    /* tick: bardan uzaklaşan kısa çizgi */
    g += '<line class="nw" x1="' + x + '" y1="' + (up ? by - 4 : by + bh + 4) + '" x2="' + x + '" y2="' +
         (up ? by - 20 : by + bh + 20) + '"/>';
    g += '<circle class="dot pop" style="animation-delay:' + (0.30 + i * 0.13) + 's" cx="' + x +
         '" cy="' + (by + bh/2) + '" r="8"/>';
    /* lb ve sub: tick'in ötesinde, üst üste binmeden */
    var lbY  = up ? by - 48 : by + bh + 44;
    var subY = up ? by - 26 : by + bh + 66;
    g += '<text class="lb" x="' + x + '" y="' + lbY + '" text-anchor="middle">' + st.en + '</text>';
    g += '<text class="lbs" x="' + x + '" y="' + subY + '" text-anchor="middle">' + st.tr + '</text>';
    s += g + '</g>';
  });
  return vzWrap(s, 612, 212);
}

/* ---------- 3) AKIŞ (koşul cümleleri, some/any/no) ---------- */
function vzFlow(sp){
  var bw = sp.boxes.length === 3 ? 168 : 232, gap = 46, h = 74;
  var totalW = sp.boxes.length * bw + (sp.boxes.length - 1) * gap;
  var sx = Math.round((612 - totalW) / 2), s = '';
  sp.boxes.forEach(function(b, i){
    var x = sx + i * (bw + gap), y = 34;
    var g = '<g' + an(i) + '>';
    g += '<rect class="' + (b.hot ? "bxa" : "bx") + '" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="12"/>';
    g += '<text class="lb" x="' + (x + bw/2) + '" y="' + (y + 27) + '" text-anchor="middle">' + b.en + '</text>';
    /* İngilizce etiketin ALTINDA renk şeridi — yazıyı Türkçe açıklamadan ayırır */
    g += '<rect class="' + (b.hot ? "ul" : "ul2") + '" x="' + (x + bw/2 - 24) + '" y="' + (y + 35) + '" width="48" height="4" rx="2"/>';
    g += '<text class="lbs" x="' + (x + bw/2) + '" y="' + (y + 58) + '" text-anchor="middle">' + b.tr + '</text>';
    /* alt etiket: ilk kutuda sola, son kutuda sağa yapışık — kenardan taşmayı önler */
    if(b.tag){
      var last = i === sp.boxes.length - 1;
      var tAnc = i === 0 ? "start" : last ? "end" : "middle";
      var tX   = i === 0 ? x : last ? x + bw : x + bw/2;
      g += '<text class="tn" x="' + tX + '" y="' + (y + h + 24) + '" text-anchor="' + tAnc + '">' + b.tag + '</text>';
    }
    if(i < sp.boxes.length - 1){
      var ax1 = x + bw + 8, ax2 = x + bw + gap - 8, my = y + h/2;
      g += '<line class="arw" x1="' + ax1 + '" y1="' + my + '" x2="' + (ax2-9) + '" y2="' + my + '"/>';
      g += '<polygon class="arwf" points="' + ax2 + ',' + my + ' ' + (ax2-10) + ',' + (my-5.5) + ' ' + (ax2-10) + ',' + (my+5.5) + '"/>';
    }
    s += g + '</g>';
  });
  return vzWrap(s, 612, 154);
}

/* ---------- 4) DALLANMA (gerund / infinitive) ---------- */
function vzSplit(sp){
  var s = '';
  s += '<g' + an(0) + '><rect class="bxa" x="26" y="60" width="180" height="60" rx="12"/>' +
       '<text class="lb" x="116" y="86" text-anchor="middle">' + sp.root.en + '</text>' +
       '<text class="lbs" x="116" y="106" text-anchor="middle">' + sp.root.tr + '</text></g>';
  sp.branches.forEach(function(b, i){
    var y = i === 0 ? 26 : 116, my = y + 32;
    var g = '<g' + an(i + 1) + '>';
    g += '<path class="arw" d="M206 90 C 250 90, 250 ' + my + ', 292 ' + my + '"/>';
    g += '<polygon class="arwf" points="304,' + my + ' 293,' + (my-5.5) + ' 293,' + (my+5.5) + '"/>';
    g += '<rect class="bx" x="308" y="' + y + '" width="282" height="64" rx="12"/>';
    g += '<text class="lb" x="326" y="' + (y+27) + '">' + b.en + '</text>';
    g += '<text class="lbs" x="326" y="' + (y+47) + '">' + b.tr + '</text>';
    s += g + '</g>';
  });
  return vzWrap(s, 612, 206);
}

/* ---------- 5) MİKTAR ÇUBUKLARI (many/much, few/little) ---------- */
function vzQty(sp){
  /* satır: [etiket] [çubuk] altında Türkçe nüans — taşma olmasın diye alt satırda */
  var s = '', y = 20, BX = 146, BW = 260;
  sp.rows.forEach(function(r, i){
    var bw = Math.max(10, Math.round(r.v * BW));
    var g = '<g' + an(i) + '>';
    g += '<text class="lb" x="10" y="' + (y + 26) + '">' + r.en + '</text>';
    g += '<rect class="bx" x="' + BX + '" y="' + (y + 8) + '" width="' + BW + '" height="24" rx="12"/>';
    g += '<rect class="' + (r.neg ? "neg" : "bar") + ' grow" style="animation-delay:' + (0.16 + i * 0.16) +
         's" x="' + BX + '" y="' + (y + 8) + '" width="' + bw +
         '" height="24" rx="12"' + (r.neg ? ' opacity="0.5"' : '') + '/>';
    g += '<text class="lbs" x="' + (BX + BW + 12) + '" y="' + (y + 26) + '">' + r.tr + '</text>';
    s += g + '</g>';
    y += 46;
  });
  return vzWrap(s, 612, y + 6);
}

/* ---------- 6) SAYILABİLİRLİK ---------- */
function vzCount(){
  var s = '';
  s += '<g' + an(0) + '><text class="lb" x="18" y="30">Countable</text>';
  s += '<text class="lbs" x="18" y="52">sayılabilir</text>';
  for(var i = 0; i < 4; i++) s += '<circle class="dot" cx="' + (40 + i*46) + '" cy="98" r="18"/>';
  s += '<text class="lbs" x="18" y="146">1, 2, 3… tek tek</text>';
  s += '<text class="lb" x="18" y="176">many / a few</text></g>';
  s += '<line class="ax" x1="306" y1="12" x2="306" y2="188" stroke-dasharray="4 6"/>';
  s += '<g' + an(1) + '><text class="lb" x="330" y="30">Uncountable</text>';
  s += '<text class="lbs" x="330" y="52">sayılamaz</text>';
  s += '<path class="blob" d="M336 112 C 336 84, 374 70, 406 78 C 442 66, 486 84, 478 110 C 496 118, 480 124, 458 122 L 352 122 C 334 122, 330 118, 336 112 Z"/>';
  s += '<text class="lbs" x="330" y="146">kütle · bölünmez</text>';
  s += '<text class="lb" x="330" y="176">much / a little</text></g>';
  return vzWrap(s, 612, 196);
}

/* ---------- 7) FİİL BAĞLANTISI (gerund ↔ infinitive) ----------
   Görsel mantık: DOLU blok = eylem gerçek / yaşanıyor  (-ing)
                  KESİKLİ blok = eylem henüz olmadı, hedef  (to + V1)
   Yazı yok, biçim anlatıyor. SVG içinde HTML etiketi KULLANILMAZ. */
function vzVLink(sp){
  var s = '', y = 16, RH = 96;
  sp.rows.forEach(function(r, i){
    var d = ' style="animation-delay:' + (0.16 + i * 0.20) + 's"';
    var g = '<g' + an(i) + '>';
    /* kaynak fiil kutusu + altında renk şeridi */
    g += '<rect class="bx" x="8" y="' + y + '" width="212" height="58" rx="13"/>';
    g += '<text class="lbm" x="114" y="' + (y + 30) + '" text-anchor="middle">' + r.src + '</text>';
    g += '<rect class="ul" x="88" y="' + (y + 42) + '" width="52" height="4" rx="2"/>';
    /* bağlantı halkası: -ing / to / ∅ */
    g += '<line class="arw draw"' + d + ' x1="220" y1="' + (y + 29) + '" x2="244" y2="' + (y + 29) + '"/>';
    g += '<rect class="chip pop"' + d + ' x="248" y="' + (y + 9) + '" width="86" height="40" rx="20"/>';
    g += '<text class="chipt" x="291" y="' + (y + 36) + '" text-anchor="middle">' + r.conn + '</text>';
    g += '<line class="arw draw"' + d + ' x1="334" y1="' + (y + 29) + '" x2="360" y2="' + (y + 29) + '"/>';
    g += '<polygon class="arwf pop"' + d + ' points="372,' + (y+29) + ' 360,' + (y+23) + ' 360,' + (y+35) + '"/>';
    /* hedef blok: dolu mu, hayalet mi */
    g += '<rect class="' + (r.solid ? "solid" : "ghost") + ' grow"' + d + ' x="378" y="' + y +
         '" width="' + (r.stopbar ? 190 : 202) + '" height="58" rx="13"/>';
    g += '<text class="lbm" x="' + (378 + (r.stopbar ? 190 : 202)/2) + '" y="' + (y + 34) +
         '" text-anchor="middle">' + r.tgt + '</text>';
    if(r.stopbar) g += '<rect class="stopbar pop"' + d + ' x="572" y="' + (y+6) + '" width="9" height="46" rx="4"/>';
    /* açıklama satırı — satırın altında, tam genişlikte (sağdan taşmasın) */
    g += '<text class="lbs" x="10" y="' + (y + 80) + '">' + r.note + '</text>';
    s += g + '</g>';
    y += RH;
  });
  return vzWrap(s, 612, y + 2);
}


/* ---------- 8) MEKÂNSAL SAHNE (yer edatları) ----------
   Her mini sahne: bir referans kutu + ona göre yerleştirilmiş top.
   Biçim anlatır; yazı sadece etiket. */
function vzSpace(sp){
  var COLS = sp.cols || 3, CW = 196, CH = 150, PAD = 8;
  var rows = Math.ceil(sp.items.length / COLS);
  var s = "";
  sp.items.forEach(function(it, i){
    var cx = (i % COLS) * CW + PAD, cy = Math.floor(i / COLS) * CH + PAD;
    var g = '<g' + an(i) + ' transform="translate(' + cx + ',' + cy + ')">';
    /* zemin çizgisi */
    g += '<line class="ax" x1="14" y1="86" x2="' + (CW - 22) + '" y2="86"/>';
    var bx = 62, by = 46, bw = 62, bh = 40;      /* referans kutu */
    var box = '<rect class="bx" x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="5"/>';
    var k = it.k, ball, extra = "";
    function dot(x, y, r){ return '<circle class="dot pop" style="animation-delay:' + (0.12 + i*0.07) + 's" cx="' + x + '" cy="' + (y||0) + '" r="' + (r||11) + '"/>'; }

    if(k === "in")            { g += box; ball = dot(bx + bw/2, by + bh/2, 10); }
    else if(k === "on")       { g += box; ball = dot(bx + bw/2, by - 11); }
    else if(k === "under")    { g += box; ball = dot(bx + bw/2, by + bh + 13); }
    else if(k === "over")     { g += box; ball = dot(bx + bw/2, by - 30);
                                extra = '<line class="nwq" x1="' + (bx+bw/2) + '" y1="' + (by-19) + '" x2="' + (bx+bw/2) + '" y2="' + (by-2) + '" stroke-dasharray="3 4"/>'; }
    else if(k === "above")    { g += box; ball = dot(bx + bw/2 + 24, by - 34); }
    else if(k === "below")    { g += box; ball = dot(bx + bw/2 + 24, by + bh + 22); }
    else if(k === "next")     { g += box; ball = dot(bx + bw + 20, by + bh/2); }
    else if(k === "behind")   { ball = dot(bx + bw/2 + 6, by + 8); g += ball + box; ball = ""; }
    else if(k === "front")    { g += box; ball = dot(bx + bw/2 - 4, by + bh - 4); }
    else if(k === "between")  { g += '<rect class="bx" x="26" y="' + by + '" width="40" height="' + bh + '" rx="5"/>' +
                                     '<rect class="bx" x="120" y="' + by + '" width="40" height="' + bh + '" rx="5"/>';
                                ball = dot(93, by + bh/2); }
    else if(k === "among")    { g += '<rect class="bx" x="24" y="' + (by+6) + '" width="26" height="' + (bh-6) + '" rx="4"/>' +
                                     '<rect class="bx" x="60" y="' + by + '" width="26" height="' + bh + '" rx="4"/>' +
                                     '<rect class="bx" x="130" y="' + (by+4) + '" width="26" height="' + (bh-4) + '" rx="4"/>' +
                                     '<rect class="bx" x="98" y="' + (by+10) + '" width="24" height="' + (bh-10) + '" rx="4"/>';
                                ball = dot(93, by + bh/2 + 4, 9); }
    else if(k === "opposite") { g += '<rect class="bx" x="26" y="' + by + '" width="46" height="' + bh + '" rx="5"/>' +
                                     '<rect class="bxa" x="114" y="' + by + '" width="46" height="' + bh + '" rx="5"/>';
                                extra = '<line class="arw" x1="78" y1="' + (by+bh/2) + '" x2="108" y2="' + (by+bh/2) + '" stroke-dasharray="4 4"/>'; }
    else if(k === "near")     { g += box; ball = dot(bx + bw + 34, by + bh/2);
                                extra = '<line class="nwq" x1="' + (bx+bw+4) + '" y1="' + (by+bh/2) + '" x2="' + (bx+bw+22) + '" y2="' + (by+bh/2) + '" stroke-dasharray="3 4"/>'; }
    /* --- hareket --- */
    else if(k === "into")     { g += box; extra = arrow(16, by + bh/2, bx + bw/2 - 4, by + bh/2, i); }
    else if(k === "outof")    { g += box; extra = arrow(bx + bw/2, by + bh/2, CW - 30, by + bh/2, i); }
    else if(k === "onto")     { g += box; extra = arc(20, by + bh + 10, bx + bw/2, by - 12, i); }
    else if(k === "through")  { g += '<rect class="bx" x="' + bx + '" y="' + (by-6) + '" width="' + bw + '" height="' + (bh+12) + '" rx="5"/>';
                                extra = arrow(16, by + bh/2, CW - 26, by + bh/2, i); }
    else if(k === "across")   { g += '<line class="ax" x1="' + bx + '" y1="30" x2="' + bx + '" y2="94" stroke-width="7"/>' +
                                     '<line class="ax" x1="' + (bx+bw) + '" y1="30" x2="' + (bx+bw) + '" y2="94" stroke-width="7"/>';
                                extra = arrow(20, by + bh/2, CW - 26, by + bh/2, i); }
    else if(k === "along")    { g += '<line class="ax" x1="14" y1="' + (by+bh+16) + '" x2="' + (CW-22) + '" y2="' + (by+bh+16) + '" stroke-width="6"/>';
                                extra = arrow(20, by + bh/2 + 6, CW - 30, by + bh/2 + 6, i); }
    else if(k === "past")     { g += box; extra = arc(16, by - 16, CW - 26, by - 16, i); }
    else if(k === "around")   { g += box;
                                extra = '<path class="arw draw" style="animation-delay:' + (0.12+i*0.07) + 's" fill="none" d="M30 ' + (by+bh/2) +
                                        ' C30 18, ' + (CW-34) + ' 18, ' + (CW-34) + ' ' + (by+bh/2) + '"/>' +
                                        '<polygon class="arwf" points="' + (CW-34) + ',' + (by+bh/2+10) + ' ' + (CW-40) + ',' + (by+bh/2-2) + ' ' + (CW-28) + ',' + (by+bh/2-2) + '"/>'; }
    else if(k === "towards")  { g += box; extra = arrow(16, by + bh/2, bx - 10, by + bh/2, i); }
    else if(k === "up")       { g += box; extra = arrow(bx + bw/2, by + bh + 22, bx + bw/2, by - 16, i); }
    else if(k === "down")     { g += box; extra = arrow(bx + bw/2, by - 16, bx + bw/2, by + bh + 22, i); }
    else                      { g += box; ball = dot(bx + bw/2, by + bh/2); }

    g += (ball || "") + extra;
    g += '<text class="lb" x="' + (CW/2 - 8) + '" y="112" text-anchor="middle">' + it.en + '</text>';
    g += '<text class="lbs" x="' + (CW/2 - 8) + '" y="132" text-anchor="middle">' + it.tr + '</text>';
    s += g + '</g>';
  });
  return vzWrap(s, COLS * CW, rows * CH + 6);
}
function arrow(x1, y1, x2, y2, i){
  var d = ' style="animation-delay:' + (0.12 + i*0.07) + 's"';
  var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx*dx + dy*dy) || 1;
  var ux = dx/L, uy = dy/L, hx = x2 - ux*11, hy = y2 - uy*11;
  var px = -uy*6, py = ux*6;
  return '<line class="arw draw"' + d + ' x1="' + x1 + '" y1="' + y1 + '" x2="' + hx + '" y2="' + hy + '"/>' +
         '<polygon class="arwf pop"' + d + ' points="' + x2 + ',' + y2 + ' ' + (hx+px) + ',' + (hy+py) +
         ' ' + (hx-px) + ',' + (hy-py) + '"/>';
}
function arc(x1, y1, x2, y2, i){
  var d = ' style="animation-delay:' + (0.12 + i*0.07) + 's"';
  var my = Math.min(y1, y2) - 26;
  return '<path class="arw draw"' + d + ' fill="none" d="M' + x1 + ' ' + y1 + ' Q' + ((x1+x2)/2) + ' ' + my + ' ' + (x2-6) + ' ' + y2 + '"/>' +
         '<polygon class="arwf pop"' + d + ' points="' + x2 + ',' + y2 + ' ' + (x2-11) + ',' + (y2-6) + ' ' + (x2-11) + ',' + (y2+6) + '"/>';
}

/* ---------- 9) KAVRAM: at / on / in ---------- */
function vzPoint(){
  var s = "";
  var scenes = [
    {t:"at", tr:"nokta", d:function(x){
      return '<circle class="bx" cx="' + (x+70) + '" cy="58" r="34"/>' +
             '<circle class="dot pop" style="animation-delay:.15s" cx="' + (x+70) + '" cy="58" r="9"/>' +
             '<line class="nwq" x1="' + (x+70) + '" y1="58" x2="' + (x+70) + '" y2="18" stroke-dasharray="3 4"/>';
    }},
    {t:"on", tr:"yüzey", d:function(x){
      return '<rect class="bx" x="' + (x+22) + '" y="66" width="96" height="14" rx="4"/>' +
             '<circle class="dot pop" style="animation-delay:.28s" cx="' + (x+70) + '" cy="55" r="11"/>';
    }},
    {t:"in", tr:"hacim", d:function(x){
      return '<rect class="bx" x="' + (x+26) + '" y="28" width="88" height="60" rx="7"/>' +
             '<circle class="dot pop" style="animation-delay:.41s" cx="' + (x+70) + '" cy="58" r="11"/>';
    }}
  ];
  scenes.forEach(function(sc, i){
    var x = i * 200;
    s += '<g' + an(i) + '>' + sc.d(x) +
         '<text class="lb" x="' + (x+70) + '" y="112" text-anchor="middle">' + sc.t + '</text>' +
         '<text class="lbs" x="' + (x+70) + '" y="132" text-anchor="middle">' + sc.tr + '</text></g>';
  });
  return vzWrap(s, 600, 142);
}

/* Kullanıcının eklediği videolar (tarayıcıda saklanır) */
function lsKey(id){ return "a2gram_listen_" + id; }
function userVids(id){
  try{ return JSON.parse(localStorage.getItem(lsKey(id)) || "[]") || []; }catch(e){ return []; }
}
function saveUserVids(id, arr){
  try{ localStorage.setItem(lsKey(id), JSON.stringify(arr)); }catch(e){}
}
/* Her biçimden video kimliği çıkar: watch?v= · youtu.be/ · shorts/ · embed/ · çıplak kimlik */
function ytId(raw){
  var s = String(raw || "").trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var m = s.match(/(?:v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function allVids(id){
  var base = (LISTEN[id] && LISTEN[id].yt) || [];
  return base.concat(userVids(id));
}

/* Bütün konulardaki tüm YouTube videolarını topla */
function getAllTopicVideos(){
  var list = [];
  T.forEach(function(t){
    var vids = allVids(t.id);
    vids.forEach(function(v, idx){
      list.push({
        id: v.id,
        t: v.t || (t.title + " - Video " + (idx + 1)),
        tid: t.id,
        topicTitle: t.title
      });
    });
  });
  return list;
}

/* YouTube Kesintisiz Oynatma Listesi URL'si (watch_videos) */
function getPlaylistUrl(vids){
  var ids = (vids || []).map(function(v){ return v.id; }).filter(Boolean);
  return "https://www.youtube.com/watch_videos?video_ids=" + ids.slice(0, 50).join(",");
}

/* YouTube Gömülü Playlist Oynatıcı Kodu */
function mountPlaylistPlayer(box, vids, startIdx){
  if(!vids || !vids.length) return;
  startIdx = startIdx || 0;
  if(startIdx < 0 || startIdx >= vids.length) startIdx = 0;
  var cur = vids[startIdx];
  var otherIds = vids.map(function(v){ return v.id; });
  var embedUrl = "https://www.youtube.com/embed/" + cur.id +
    "?playlist=" + otherIds.join(",") + "&autoplay=1&playsinline=1&rel=0";
  var isFile = window.location.protocol === "file:";
  var ytPlUrl = getPlaylistUrl(vids);

  var h = '<div class="vframe"><iframe src="' + embedUrl + '" title="Playlist" frameborder="0" allowfullscreen ' +
    'referrerpolicy="strict-origin-when-cross-origin" ' +
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';

  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:8px;padding:2px 0">' +
       '<a class="btn btn-yt" style="padding:6px 12px;font-size:12px" target="_blank" rel="noopener noreferrer" data-yturl="' + ytPlUrl + '" href="' + ytPlUrl + '">↗ YouTube Uygulamasında Kesintisiz Aç (Arka Plan / PiP)</a>' +
       '<span style="font-size:11.5px;color:var(--muted)">Telefonda arka planda dinlemek için YouTube uygulamasında açabilirsiniz</span>' +
       '</div>';

  if(isFile){
    h += '<div class="v-file-notice" style="margin-top:6px">' +
      '<span>💡 Not: YouTube yerel dosyada (file://) engellerse:</span> ' +
      '<a href="' + ytPlUrl + '" target="_blank" rel="noopener noreferrer" data-yturl="' + ytPlUrl + '">YouTube\'da Playlist Olarak Aç ↗</a>' +
      '</div>';
  }

  // Playlist İçi Parça Listesi ve Kontroller
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px">' +
       '<div style="font-size:12.5px;font-weight:700">Şu an: ' + (startIdx + 1) + ' / ' + vids.length + ' - ' + esc(cur.t) + '</div>' +
       '<div style="display:flex;gap:6px">' +
       '<button class="btn" id="plPrevBtn"' + (startIdx === 0 ? ' disabled style="opacity:.5"' : '') + '>‹ Önceki</button>' +
       '<button class="btn" id="plNextBtn"' + (startIdx === vids.length - 1 ? ' disabled style="opacity:.5"' : '') + '>Sonraki ›</button>' +
       '</div></div>';

  h += '<div class="playlist-queue">';
  vids.forEach(function(v, idx){
    h += '<div class="queue-item' + (idx === startIdx ? ' active' : '') + '" data-plidx="' + idx + '">' +
      '<span class="queue-num">' + (idx + 1) + '.</span>' +
      '<span class="queue-title">' + esc(v.t) + '</span>' +
      (v.topicTitle ? '<span class="queue-topic">' + esc(v.topicTitle) + '</span>' : '') +
      '</div>';
  });
  h += '</div>';

  box.innerHTML = h;

  var prevB = box.querySelector("#plPrevBtn");
  if(prevB && startIdx > 0) prevB.onclick = function(){ mountPlaylistPlayer(box, vids, startIdx - 1); };
  var nextB = box.querySelector("#plNextBtn");
  if(nextB && startIdx < vids.length - 1) nextB.onclick = function(){ mountPlaylistPlayer(box, vids, startIdx + 1); };

  box.querySelectorAll("[data-plidx]").forEach(function(item){
    item.onclick = function(){
      var idx = parseInt(this.getAttribute("data-plidx"), 10);
      mountPlaylistPlayer(box, vids, idx);
    };
  });
}

function openExternal(url){
  if(!url) return;
  try {
    var win = window.open(url, "_blank", "noopener,noreferrer");
    if(!win || win.closed || typeof win.closed === "undefined"){
      window.location.href = url;
    }
  } catch(e){
    window.location.href = url;
  }
}
window.openExternal = openExternal;

function vidCard(v, i, tid){

        '<a class="yt-link-subtle" target="_blank" rel="noopener noreferrer" href="' + ytUrl + '" data-yturl="' + ytUrl + '">YouTube\'da aç ↗</a>' +

function mountPlayer(box, vid){
  var isFile = window.location.protocol === "file:";
  var ytUrl = "https://www.youtube.com/watch?v=" + vid;
  var h = '<div class="vframe"><iframe src="https://www.youtube.com/embed/' + vid +
    '?autoplay=1&playsinline=1&rel=0" title="Dinleme" frameborder="0" allowfullscreen ' +
    'referrerpolicy="strict-origin-when-cross-origin" ' +
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;padding:2px 4px">' +
    '<a class="btn-yt" style="padding:4px 8px;font-size:11.5px" target="_blank" rel="noopener noreferrer" data-yturl="' + ytUrl + '" href="' + ytUrl + '">↗ YouTube Uygulamasında Aç (Arka Plan / PiP)</a>' +
    '</div>';
  if(isFile){
    h += '<div class="v-file-notice" style="margin-top:6px">' +
      '<span>💡 Not: YouTube yerel dosyalarda gömülü oynatmayı kısıtlarsa:</span> ' +
      '<a href="' + ytUrl + '" target="_blank" rel="noopener noreferrer" data-yturl="' + ytUrl + '">YouTube\'da İzle ↗</a>' +
      '</div>';

}

function wireListen(root, tid){
  var topicVids = allVids(tid);
  var allV = getAllTopicVideos();
  var plBox = root.querySelector("#plPlayerBox");

  var topicPlBtn = root.querySelector("#btnTopicPl");
  if(topicPlBtn && plBox){
    topicPlBtn.onclick = function(){
      plBox.hidden = false;
      mountPlaylistPlayer(plBox, topicVids, 0);
      plBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
  }

  var masterPlBtn = root.querySelector("#btnMasterPl");
  if(masterPlBtn && plBox){
    masterPlBtn.onclick = function(){
      plBox.hidden = false;
      mountPlaylistPlayer(plBox, allV, 0);
      plBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
  }

  var grid = root.querySelector("#lGrid");
  if(grid){
    grid.querySelectorAll("[data-playvid]").forEach(function(b){
      b.onclick = function(){
        var vid = this.getAttribute("data-playvid");
        var card = this.closest(".vcard"), box = card.querySelector(".vplayer-box");
        mountPlayer(box, vid);
      };
    });
  }
  var addBtn = root.querySelector("[data-addvid]"), box = root.querySelector("#lAdd");
  if(addBtn && box) addBtn.onclick = function(){ box.hidden = !box.hidden; if(!box.hidden) root.querySelector("#lUrl").focus(); };
  var cancel = root.querySelector("[data-canceladd]");
  if(cancel && box) cancel.onclick = function(){ box.hidden = true; };
  var save = root.querySelector("[data-savevid]");
  if(save) save.onclick = function(){
    var inp = root.querySelector("#lUrl"), err = root.querySelector("#lErr");
    var id = ytId(inp.value);
    if(!id){ err.hidden = false; err.textContent = "Geçerli bir YouTube adresi bulamadım. Örnek: youtube.com/watch?v=XXXXXXXXXXX"; return; }
    err.hidden = true;
    var arr = userVids(tid);
    if(arr.some(function(x){ return x.id === id; })){ err.hidden = false; err.textContent = "Bu video zaten ekli."; return; }
    arr.push({id:id, t:"Eklediğim video " + (arr.length + 1), user:true});
    saveUserVids(tid, arr);
    showTopic(tid);
  };
  root.querySelectorAll("[data-delvid]").forEach(function(b){
    b.onclick = function(){
      var vid = this.getAttribute("data-delvid"), t = this.getAttribute("data-tid");
      saveUserVids(t, userVids(t).filter(function(x){ return x.id !== vid; }));
      showTopic(t);
    };
  });
}

function vizPanel(id){
  var sp = VZ[id];
  if(!sp) return "";
  var fn = VZ_RENDER[sp.t];
  if(!fn) return "";
  var body = "";
  try{ body = fn(sp); }catch(e){ return ""; }
  return '<details class="viz" open><summary><span>🎬</span>Görsel Anlatım</summary>' +
         '<div class="viz-body"><div id="vzHost">' + body + '</div>' +
         (sp.cap ? '<p class="viz-cap">' + sp.cap + '</p>' : '') +
         (sp.ex ? '<div class="viz-ex"><div class="en gl">' + sp.ex[0] + '</div><div class="tr">' + sp.ex[1] + '</div></div>' : '') +
         '</div></details>';
}

function showTopic(id){
  var t = null, idx = -1;
  T.forEach(function(x,i){ if(x.id===id){ t=x; idx=i; } });
  if(!t) return showHome();
  current = id;
  var nd = NODES.filter(function(n){return n.n===t.node;})[0];
  var h = '<div class="crumb">Düğüm '+nd.n+' · '+nd.title+'</div>'+
          '<h1 class="topic-title">'+esc(t.title)+'</h1>'+
          '<p class="topic-sub">'+esc(t.sub)+'</p>'+
          '<p class="gloss-hint">💡 İngilizce cümlelerde altı noktalı <b>kelimelere</b> dokun (veya üzerine gel) — Türkçe anlamını gösterir.</p>'+
          vizPanel(id)+
          listenPanel(id)+
          renderSections(t.s) + renderQuiz(t.q, id);
  h += '<div class="done-bar">'+
       '<button class="btn primary" id="markDone">'+(done[id]?"✓ Tamamlandı":"Konuyu tamamladım")+'</button>';
  if(idx > 0) h += '<button class="btn" data-go="'+T[idx-1].id+'">‹ Önceki</button>';
  if(idx < T.length-1) h += '<button class="btn" data-go="'+T[idx+1].id+'">Sonraki ›</button>';
  else h += '<button class="btn primary" data-go="__exam">🎓 Genel Değerlendirmeye Geç ›</button>';
  h += '</div>';
  main.innerHTML = h;
  window.scrollTo(0,0);
  /* Görsel, konu açıldığında SVG eklendiği an kendiliğinden bir kez oynar
     (CSS animasyonları render'da başlar — ayrı bir tetikleyiciye gerek yok). */
  var lp = main.querySelector("details.listen");
  if(lp) wireListen(lp, id);
  applyGloss(main);
  wireQuiz(main, t.q);
  el("markDone").onclick = function(){
    done[id] = !done[id]; saveDone();
    this.textContent = done[id] ? "✓ Tamamlandı" : "Konuyu tamamladım";
    buildNav(el("search").value);
  };
  if(fab){
    fab.style.display = window.innerWidth <= 900 ? "inline-flex" : "none";
    fab.onclick = function(){ if(idx < T.length-1) go(T[idx+1].id); else showExam(true); };
  }
  buildNav(el("search").value);
  closeNav();
}

/* ---------- Karışık test ---------- */
function showBigQuiz(){
  current = null; closeNav();
  var pool = [];
  T.forEach(function(t){ t.q.forEach(function(q){ pool.push(q); }); });
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
  var qs = pool.slice(0, 25);
  var right = 0, answered = 0;
  main.innerHTML = '<div class="crumb">Genel Değerlendirme</div><h1 class="topic-title">Karışık Test</h1>'+
    '<p class="topic-sub">Tüm konulardan rastgele 25 soru.</p>'+
    '<div class="score" id="scoreBox"><div class="big" id="scoreBig">0 / 0</div><div style="color:var(--muted)">Cevapladıkça skor güncellenir</div></div>'+
    renderQuiz(qs, "big") +
    '<div class="btn-row"><button class="btn primary" id="againBtn">Yeni Test</button><button class="btn" data-go="__home">Ana Sayfa</button></div>';
  window.scrollTo(0,0);
  fab.style.display = "none";
  applyGloss(main);
  wireQuiz(main, qs, function(ok){
    answered++; if(ok) right++;
    el("scoreBig").textContent = right + " / " + answered;
  });
  el("againBtn").onclick = showBigQuiz;
}

function editDist(a, b, max){
  var la = a.length, lb = b.length;
  if(Math.abs(la - lb) > max) return max + 1;
  var prev = [], cur = [], i, j;
  for(j = 0; j <= lb; j++) prev[j] = j;
  for(i = 1; i <= la; i++){
    cur[0] = i;
    var best = cur[0];
    for(j = 1; j <= lb; j++){
      var cost = a.charAt(i-1) === b.charAt(j-1) ? 0 : 1;
      cur[j] = Math.min(cur[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
      if(cur[j] < best) best = cur[j];
    }
    if(best > max) return max + 1;
    for(j = 0; j <= lb; j++) prev[j] = cur[j];
  }
  return prev[lb];
}

function suggestSpelling(word){
  var w = String(word).toLowerCase();
  if(SUGG_CACHE[w] !== undefined) return SUGG_CACHE[w];
  buildDict();
  var keys = LEMMAS;                      /* sadece kök kelimeler — üretilmiş çekimler değil */
  var maxD = w.length <= 4 ? 1 : 2;       /* kısa kelimelerde 2 mesafe çok gürültülü */
  var c0 = w.charAt(0), cz = w.charAt(w.length - 1);
  var best = null, bestScore = 999;
  for(var i = 0; i < keys.length; i++){
    var k = keys[i];
    if(Math.abs(k.length - w.length) > maxD) continue;
    var dist = editDist(w, k, maxD);
    if(dist > maxD) continue;
    /* Aynı mesafedeyse: ilk harfi tutan aday çok daha olasıdır */
    var score = dist * 10
              - (k.charAt(0) === c0 ? 4 : 0)
              - (k.charAt(k.length-1) === cz ? 2 : 0)
              - (k.length === w.length ? 1 : 0);
    if(score < bestScore){ bestScore = score; best = k; if(score <= 3) break; }
  }
  /* Çoğul/çekimli yazım hatası: kökü düzelt, eki geri ekle (freinds → friends) */
  if(!best){
    var suf = /(ies|es|s|ed|ing)$/.exec(w);
    if(suf && w.length - suf[0].length >= 3){
      var stem = w.slice(0, w.length - suf[0].length);

                 : /(s|x|z|ch|sh|o)$/.test(sb) ? sb + "es" : sb + "s";
    }
  }
  SUGG_CACHE[w] = best;
  return best;
}
