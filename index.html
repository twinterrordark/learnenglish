  each("can could will would shall should may might must can't couldn't won't wouldn't shouldn't mustn't shan't", function(w){ add(w,"M"); });
  each("of in on at from by with without about into onto over under above below between among through during against along across behind beside near around up down out off away toward towards upon within outside inside since for except beyond throughout", function(w){ add(w,"E"); });
  add("to","T");

  Object.keys(IRR2BASE).forEach(function(w){

/* base + istenen etiket → yüzey biçimi */
function formOf(base, tag){
  if(!base) return "";
  if(tag === "V") return base;
  if(tag === "Z") return thirdOf(base);
  if(tag === "G") return ing(base);
  if(tag === "2") return toV2(base);
  if(tag === "3") return V1V3[base] || toV2(base);
  return base;
}
function guessTags(lw, raw){
  if(/^\d+$/.test(lw)) return "U";
  if(/ing$/.test(lw)) return "GN";
  if(/ed$/.test(lw))  return "23";
  if(/ly$/.test(lw))  return "R";
  if(/(tion|sion|ment|ness|ity|ship|hood|ance|ence|ist|ism)$/.test(lw)) return "N";
  if(/(ous|ful|ive|able|ible|ical|ish|less|al|ic)$/.test(lw)) return "J";
  if(/s$/.test(lw)) return "SZ";
  return "NVJ";
}
var PREF_START = "PDWUNSBMARJVEOTG";
var PREF = {
  D:"JUNSG", J:"NSJ", U:"NSJ",
  P:"BHMAZ2VRJ", O:"BHMAZ2VR",
  M:"VBRH", T:"VBR", B:"GJ3NSRDEUV", H:"32RVB", A:"VRN",
  E:"GDUNSJPO", C:"PDWNSBMAVRJU", W:"BHMAPDNSU",
  N:"BHMAZ2VECRJ", S:"BHMAZ2VECRJ",
  Z:"DUNSEJRPOTC", V:"DUNSEJRPOTC", "2":"DUNSEJRPOTC", "3":"DUNSEJRPOTC", G:"DUNSEJRPOTC"
};
function pickTag(c, prev, isStart){
  if(!c) return "N";
  if(c.length === 1) return c;
  var order = (isStart || !prev) ? PREF_START : (PREF[prev] || PREF_START);
  for(var i = 0; i < order.length; i++)
    if(c.indexOf(order.charAt(i)) >= 0) return order.charAt(i);
  return c.charAt(0);
}
/* Cümleyi kelimelere böl ve etiketle */
function tagSentence(txt, base){
  buildLex();
  var toks = [], re = /[A-Za-z][A-Za-z']*/g, m;
  while((m = re.exec(txt)) !== null)
    toks.push({w:m[0], lw:m[0].toLowerCase(), i:base + m.index});
  toks.forEach(function(t, k){
    var c = LEX[t.lw];
    if(!c){
      if(k > 0 && /^[A-Z]/.test(t.w)){ c = "N"; t.proper = true; }
      else c = guessTags(t.lw, t.w);
    }
    t.c = c;
  });
  var prev = null;
  toks.forEach(function(t, k){
    t.t = pickTag(t.c, prev, k === 0);
    if(t.t !== "R") prev = t.t;
  });
  return toks;
}
function isFinite_(t){ return "BHMAZ2V".indexOf(t) >= 0; }
function subjNum(tok){
  var lw = tok.lw;
  if(lw === "i") return "1s";
  if(lw === "you") return "2";
  if(lw === "he" || lw === "she" || lw === "it") return "3s";
  if(lw === "we" || lw === "they") return "3p";
  if(tok.t === "S") return "3p";
  if(tok.t === "N" || tok.proper) return "3s";
  if(tok.t === "O") return /^(they|both|many|few|several)$/.test(lw) ? "3p" : "3s";
  return null;
}
var BE_FOR = {"1s":{pres:"am", past:"was"}, "2":{pres:"are", past:"were"},
              "3s":{pres:"is", past:"was"}, "3p":{pres:"are", past:"were"}};

/* Yapısal denetim: bulunan sorunları add() ile bildirir */
function structuralCheck(sentTxt, offset, add){
  var toks = tagSentence(sentTxt, offset);
  if(!toks.length) return;
  var i, t, n;
  function nextIdx(k){ var j = k + 1; while(j < toks.length && toks[j].t === "R") j++; return j; }

  /* --- 1) Modal / do / to sonrası yalın fiil --- */
  for(i = 0; i < toks.length; i++){
    t = toks[i];
    if(t.t !== "M" && t.t !== "A" && t.t !== "T") continue;
    var j = nextIdx(i);
    if(j >= toks.length) continue;
    n = toks[j];
    /* "to" + -ing yalnızca mastar alan bir fiilden sonra hatadır.
       "look forward to seeing", "be used to living" gibi yapılarda "to" edattır. */
    if(t.t === "T" && n.t === "G"){
      var pi = i - 1; while(pi >= 0 && toks[pi].t === "R") pi--;
      var pv = pi >= 0 ? ((FORM[toks[pi].lw] || {}).b || toks[pi].lw) : "";
      if(!INF_TO[pv]) continue;
    }
    var label = t.t === "M" ? "Modal" : t.t === "A" ? "do / does / did" : "to";
    var link  = t.t === "M" ? "can-could" : t.t === "A" ? "past-simple" : "infinitive";
    if(t.t === "M" && n.t === "T"){
      var k2 = nextIdx(j), vb = k2 < toks.length ? toks[k2] : null;
      var vbase = vb ? ((FORM[vb.lw] || {}).b || vb.w) : "";
      var span = vb ? (vb.i + vb.w.length - n.i) : n.w.length;
      add(n.i, span, "err", "Modal + to",
        "<b>" + esc(t.w) + "</b> bir modal fiildir; ardından <b>to</b> gelmez, fiil yalın kalır.",
        vbase, link);
      continue;
    }
    if("VBHM".indexOf(n.t) >= 0) continue;          /* yalın fiil ✔ */
    if("ZG23".indexOf(n.t) < 0) continue;           /* fiil değilse karışma */
    var b = (FORM[n.lw] || {}).b;
    if(!b) continue;
    add(n.i, n.w.length, "err", label + " + yalın fiil",
      "<b>" + esc(t.w) + "</b> sonrası fiil daima <b>yalın hâlde (V1)</b> olur; kişi/zaman eki almaz.",
      b, link);
  }

  /* --- 2) be + yalın fiil → -ing ; have + yalın/geçmiş → V3 --- */
  for(i = 0; i < toks.length; i++){
    t = toks[i];
    var j2 = nextIdx(i);
    if(j2 >= toks.length) continue;
    n = toks[j2];
    var bb = (FORM[n.lw] || {}).b;
    if(t.t === "B" && n.t === "V" && bb){
      add(n.i, n.w.length, "err", "be + yalın fiil",
        "<b>be</b> fiilinden sonra yalın fiil gelmez. Şimdiki zaman için <b>-ing</b> gerekir.",
        formOf(bb, "G"), "present-continuous");
    }
    if(t.t === "H" && (n.t === "V" || n.t === "2") && bb && formOf(bb,"3") !== n.lw){
      add(n.i, n.w.length, "err", "have + V3",
        "<b>have / has / had</b> sonrası fiil <b>3. hâlde (past participle)</b> olur.",
        formOf(bb, "3"), "present-perfect");
    }
  }

  /* --- 3) Edattan sonra fiil → -ing --- */
  for(i = 0; i < toks.length; i++){
    t = toks[i];
    if(t.t !== "E") continue;
    var j3 = nextIdx(i);
    if(j3 >= toks.length) continue;
    n = toks[j3];
    var b3 = (FORM[n.lw] || {}).b;
    if((n.t === "V" || n.t === "Z") && b3 && n.c.indexOf("N") < 0)
      add(n.i, n.w.length, "err", "Edattan sonra -ing",
        "<b>" + esc(t.w) + "</b> bir edattır; edattan sonra gelen fiil <b>-ing</b> hâlinde olur.",
        formOf(b3, "G"), "gerund");
  }

  /* --- 4) Özne–yüklem uyumu + zaman tutarlılığı --- */
  var pastMark = /\b(yesterday|last\s+\w+|\w+\s+ago|in\s+(19|20)\d{2})\b/i.test(sentTxt);

    t = toks[i];
    if("PNS".indexOf(t.t) < 0 && !t.proper) continue;
    if(i > 0 && "DJU".indexOf(toks[i-1].t) >= 0 && t.t === "N" && toks[i-1].lw === "a" && UNC[t.lw]){
      add(toks[i-1].i, toks[i-1].w.length + 1 + t.w.length, "err", "a + sayılamaz isim",
        "<b>" + esc(t.w) + "</b> sayılamaz bir isimdir; <b>a / an</b> almaz.", "some " + t.lw, "count-uncount");
    }
    /* Devrik soru: "Does he go…" — kişi ekini yardımcı fiil taşır, ana fiil yalın kalır */
    var pb = i - 1; while(pb >= 0 && toks[pb].t === "R") pb--;
    if(pb >= 0 && "AMBH".indexOf(toks[pb].t) >= 0) continue;

    var jv = nextIdx(i);
    if(jv >= toks.length) continue;
    var v = toks[jv];
    if(!isFinite_(v.t)) continue;
    var num = subjNum(t);
    if(!num) continue;
    var is3s = num === "3s";

    var neg = /n't$/.test(v.lw), core = v.lw.replace(/n't$/, "");
    function agree(want, why){
      if(!want || want === core) return;
      var full = neg ? want + "n't" : want;
      add(v.i, v.w.length, "err", "Özne–yüklem uyumu",
        "<b>" + esc(t.w) + "</b> öznesiyle <b>" + full + "</b> kullanılır. " + (why || ""), full, "simple-present");
    }
    if(v.t === "B"){
      if(/^(am|is|are)$/.test(core)) agree(BE_FOR[num].pres);
      else if(/^(was|were)$/.test(core)) agree(BE_FOR[num].past);
    } else if(v.t === "H"){
      if(core === "have" || core === "has") agree(is3s ? "has" : "have");
    } else if(v.t === "A"){
      if(core === "do" || core === "does") agree(is3s ? "does" : "do");
    } else if(v.t === "V" || v.t === "Z"){
      var bv = (FORM[v.lw] || {}).b;
      if(pastMark && bv){
        add(v.i, v.w.length, "warn", "Zaman uyuşmuyor",
          "Cümlede geçmiş zaman ifadesi var (<i>yesterday / last… / ago</i>) ama fiil <b>geniş zamanda</b>. " +
          "Fiilin <b>V2 (geçmiş)</b> hâli gerekir.", formOf(bv, "2"), "past-simple");
      } else if(bv && is3s && v.t === "V"){
        add(v.i, v.w.length, "err", "3. tekil şahıs -s eki",

      }

  /* --- 5) Yüklemi olmayan cümlecik --- */
  var clauses = [], cur = [];
  toks.forEach(function(tk){
    if(tk.t === "C"){ if(cur.length) clauses.push(cur); cur = []; }
    else cur.push(tk);
  });
  if(cur.length) clauses.push(cur);
  clauses.forEach(function(cl){
    if(cl.length < 2) return;
    var head = cl[0];
    var isP = head.t === "P";
    if(!isP && head.t !== "D") return;
    for(var k = 0; k < cl.length; k++) if(isFinite_(cl[k].t)) return;      /* yüklem var ✔ */
    if(!isP && cl.length < 3) return;                                      /* "No problem." gibi kısa kalıplar */
    var g = null, pp = null, comp = null;
    for(var k2 = 1; k2 < cl.length; k2++){
      if(cl[k2].t === "G" && !g) g = cl[k2];
      if(cl[k2].t === "3" && !pp) pp = cl[k2];
      if(("JNS".indexOf(cl[k2].t) >= 0) && !comp) comp = cl[k2];
    }
    if(!g && !pp && !comp) return;
    var num2 = subjNum(head) || "3s";
    var be = BE_FOR[num2].pres;
    var span = cl[cl.length-1].i + cl[cl.length-1].w.length - head.i;
    add(head.i, Math.min(span, 40), isP ? "err" : "warn", "Yüklem (be fiili) eksik",
      "Bu cümleciğin <b>çekimli bir fiili yok</b>. İngilizcede her cümlede çekimli fiil bulunmalıdır — " +
      (g ? "<b>-ing</b> hâlinden önce <b>am / is / are</b> gerekir."
         : pp ? "3. hâlden önce <b>be</b> veya <b>have</b> gerekir."
              : "özne ile tamlayan arasında <b>be</b> fiili gerekir."),
      head.w + " " + be + (g ? " " + g.w : comp ? " " + comp.w : ""), "present-continuous");
  });
}

function highlight(txt, fs){
  var h = "", last = 0;
  fs.filter(function(f){return f.i >= 0;}).forEach(function(f){
    if(f.i < last) return;
    h += esc(txt.slice(last, f.i)) + '<mark class="mk '+f.sev+'">' + esc(txt.slice(f.i, f.e)) + '</mark>';
    last = f.e;
  });
  return h + esc(txt.slice(last));
}

var GLOSS = null;
function buildGloss(){
  if(GLOSS) return GLOSS;
  var g = {};
  GLOSS_RAW.split("|").forEach(function(pair){
    var k = pair.indexOf("=");
    if(k > 0){ var w = pair.slice(0,k).trim().toLowerCase(); if(w) g[w] = pair.slice(k+1).trim(); }
  });
  GLOSS = g;
  return g;
}

/* Bir kelimeyi köküne indirip anlamını bul */
function lookup(word){
  var g = buildGloss();
  var w = String(word).toLowerCase().replace(/[^a-z']/g, "");
  if(!w) return null;
  if(g[w]) return {w:word, base:w, tr:g[w], note:""};

  if(IRR2BASE[w] && g[IRR2BASE[w]])
    return {w:word, base:IRR2BASE[w], tr:g[IRR2BASE[w]], note:IRR_NOTE[w] ? "düzensiz fiilin geçmiş hâli" : "düzensiz çoğul/hâl"};

  var ap = w.indexOf("'");
  if(ap > 0){
    var stem = w.slice(0, ap), suf = w.slice(ap+1);
    var sufTr = {s:"…dir / …in", t:"olumsuzluk (not)", re:"…siniz (are)", ve:"…dim (have)",
                 ll:"…ecek (will)", d:"…ardı (would/had)", m:"…im (am)"}[suf];
    if(g[stem]) return {w:word, base:stem, tr:g[stem], note:sufTr ? "kısaltma: '" + suf + " = " + sufTr : "kısaltma"};
  }

  var cands = [];
  if(/ies$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/ied$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/iest$/.test(w)) cands.push(w.slice(0,-4) + "y");
  if(/ier$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/ily$/.test(w)) cands.push(w.slice(0,-3) + "y");
  if(/es$/.test(w)) cands.push(w.slice(0,-2));
  if(/s$/.test(w)) cands.push(w.slice(0,-1));
  if(/ed$/.test(w)) cands.push(deEd(w));
  if(/ing$/.test(w)) cands.push(deing(w));
  if(/est$/.test(w)) { cands.push(w.slice(0,-3)); cands.push(w.slice(0,-2)); }
  if(/er$/.test(w)) { cands.push(w.slice(0,-2)); cands.push(w.slice(0,-1)); }
  if(/ly$/.test(w)) cands.push(w.slice(0,-2));
  if(/([^aeiou])\1(ed|ing|er|est)$/.test(w)) cands.push(w.replace(/([^aeiou])\1(ed|ing|er|est)$/, "$1"));

  for(var i=0;i<cands.length;i++){
    var c = cands[i];
    if(c && c !== w && g[c]){
      var note = /ing$/.test(w) ? "-ing hâli" : /ed$/.test(w) ? "geçmiş / -ed hâli"
               : /(iest|est)$/.test(w) ? "en üstünlük hâli" : /(ier|er)$/.test(w) ? "karşılaştırma / -er hâli"
               : /ly$/.test(w) ? "zarf hâli" : "çoğul / -s hâli";
      return {w:word, base:c, tr:g[c], note:note};
    }
  }
  return null;
}

/* Metin düğümlerindeki kelimeleri sarmala */
function applyGloss(root){
  if(!root) return;
  var sels = ".ex .en, .q-text, .preview, .model p, .gl";
  var targets = root.querySelectorAll(sels);
  for(var t=0; t<targets.length; t++){
    var cont = targets[t];
    if(cont.dataset.glossed) continue;
    cont.dataset.glossed = "1";
    var nodes = [], walk = document.createTreeWalker(cont, NodeFilter.SHOW_TEXT, null);
    var n; while((n = walk.nextNode())) if(/[A-Za-z]/.test(n.nodeValue)) nodes.push(n);
    nodes.forEach(function(node){
      var parent = node.parentNode;
      if(!parent || parent.classList && parent.classList.contains("w")) return;
      if(parent.closest && parent.closest("code, .frag, mark.mk .w")) return;
      var txt = node.nodeValue, frag = document.createDocumentFragment();
      var re = /[A-Za-z][A-Za-z']*/g, m, last = 0, any = false;
      while((m = re.exec(txt)) !== null){
        var hit = lookup(m[0]);
        if(!hit) continue;
        any = true;
        if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var sp = document.createElement("span");
        sp.className = "w"; sp.textContent = m[0];
        sp.setAttribute("data-b", hit.base); sp.setAttribute("data-t", hit.tr); sp.setAttribute("data-n", hit.note || "");
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if(!any) return;
      if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      parent.replaceChild(frag, node);
    });
  }
}

/* Balon */
var wtip = null, wcur = null;
function showTip(elm){
  if(!wtip){
    wtip = document.createElement("div");
    wtip.id = "wtip";
    wtip.onclick = hideTip;
    document.body.appendChild(wtip);
  }
  var word = elm.textContent, base = elm.getAttribute("data-b"),
      tr = elm.getAttribute("data-t"), note = elm.getAttribute("data-n");
  wtip.innerHTML = '<div><span class="ww">' + esc(word) + '</span>' +
    (base && base.toLowerCase() !== word.toLowerCase() ? '<span class="wb">→ ' + esc(base) + '</span>' : '') +
    '</div><div class="wt">' + esc(tr) + '</div>' +
    (note ? '<div class="wn">' + esc(note) + '</div>' : '');
  wtip.classList.add("show");
  if(wcur) wcur.classList.remove("act");
  wcur = elm; elm.classList.add("act");
  var r = elm.getBoundingClientRect(), tw = wtip.offsetWidth, th = wtip.offsetHeight;
  var x = Math.min(Math.max(8, r.left + r.width/2 - tw/2), window.innerWidth - tw - 8);
  var y = r.top - th - 9;
  if(y < 8) y = r.bottom + 9;
  if(y + th > window.innerHeight - 8) y = Math.max(8, window.innerHeight - th - 8);
  wtip.style.left = x + "px";
  wtip.style.top = y + "px";
}
function hideTip(){
  if(wtip) wtip.classList.remove("show");
  if(wcur){ wcur.classList.remove("act"); wcur = null; }
}
document.addEventListener("mouseover", function(e){
  var t = e.target.closest && e.target.closest(".w");
  if(t) showTip(t);
});
document.addEventListener("mouseout", function(e){
  if(e.target.closest && e.target.closest(".w")) hideTip();
});
document.addEventListener("click", function(e){
  var t = e.target.closest && e.target.closest(".w");
  if(t){ e.stopPropagation(); if(wcur === t) hideTip(); else showTip(t); }
  else hideTip();
}, true);
window.addEventListener("scroll", hideTip, true);

var GEMINI_KEY   = "";
var GEMINI_MODEL = "gemini-3.5-flash-lite";   /* varsayılan hızlı model */
var AI_MIN_GAP   = 2000;                       /* iki istek arası en az bekleme (ms) */
var aiLast = 0;

/* Anahtardaki tırnak, boşluk, önek ("GEMINI_KEY=") ve görünmez karakterleri temizle */
function cleanApiKey(raw){
  if(!raw) return "";
  var s = String(raw).trim();
  s = s.replace(/[\u200B-\u200D\uFEFF]/g, ""); // görünmez unicode karakterlerini temizle
  if(s.indexOf("=") >= 0){
    s = s.slice(s.indexOf("=") + 1).trim();
  } else if(s.indexOf(":") >= 0 && !s.startsWith("http")){
    s = s.slice(s.indexOf(":") + 1).trim();
  }
  s = s.replace(/^["'`]+|["'`]+$/g, "").trim();
  return s;
}

function aiKey(){
  try{
    var ki = el("aiKeyInput");
    if(ki && ki.value){
      var cl = cleanApiKey(ki.value);
      if(cl){
        try{ localStorage.setItem("a2gram_gemini_key", cl); }catch(e){}
        return cl;
      }
    }
  }catch(e){}
  try{
    var k = localStorage.getItem("a2gram_gemini_key");
    if(k){
      var clk = cleanApiKey(k);
      if(clk) return clk;
    }
  }catch(e){}
  return cleanApiKey(GEMINI_KEY);
}

function testGeminiKey(rawKey){
  var key = cleanApiKey(rawKey);
  if(!key) return Promise.reject(new Error("Lütfen bir API anahtarı girin."));
  var isAq = key.startsWith("AQ.");
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent" + (isAq ? "" : "?key=" + encodeURIComponent(key));
  return fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify({
      contents: [{ parts: [{ text: "ping" }] }],
      generationConfig: { maxOutputTokens: 5 }
    })
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){
        var msg = (j.error && j.error.message) || ("HTTP " + r.status);
        if(r.status === 401 || r.status === 403){
          msg = "API anahtarı geçersiz veya yetkisiz (401/403). Lütfen aistudio.google.com üzerinden yeni bir anahtar oluşturup yapıştırın.";
        } else if(r.status === 429){
          msg = "API kotası dolu veya çok sık istek yapıldı (429).";
        }
        var err = new Error(msg);
        err.code = r.status;
        throw err;
      }
      return j;
    });
  });
}

function callGeminiGenerate(key, bodyPayload, modelName){
  var model = modelName || GEMINI_MODEL;
  var isAq = key.startsWith("AQ.");
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent" + (isAq ? "" : "?key=" + encodeURIComponent(key));
  return fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify(bodyPayload)
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){
        if(r.status === 404 && model !== "gemini-2.5-flash"){
          // Model bulunamazsa yedek modele geç
          return callGeminiGenerate(key, bodyPayload, "gemini-2.5-flash");
        }
        var e = new Error((j.error && j.error.message) || ("HTTP " + r.status));
        e.code = r.status; e.status = j.error && j.error.status;
        throw e;
      }
      return j;
    });
  });
}

function aiCountToday(inc){
  var today = new Date().toISOString().slice(0,10), n = 0;
  try{
    var raw = JSON.parse(localStorage.getItem("a2gram_ai_count") || "{}");
    n = raw.d === today ? (raw.n || 0) : 0;
    if(inc){ n++; localStorage.setItem("a2gram_ai_count", JSON.stringify({d:today, n:n})); }
  }catch(e){}
  return n;
}

var AI_SYS = "You are an English teacher marking CEFR A2 writing by Turkish native speakers. " +
  "Find EVERY mistake: grammar, spelling, wrong word choice, unnatural phrasing, punctuation, " +
  "tense consistency across the whole text, and sentences that are grammatically correct but do not make sense. " +
  "For each issue: 'sentence' = the complete sentence containing the error, copied character-for-character " +
  "from the student text; 'quote' = the exact erroneous fragment inside that sentence, also copied " +
  "character-for-character. Both must appear verbatim in the student text so they can be located. " +
  "Write every explanation in simple TURKISH for a beginner, one or two short sentences. " +
  "If the text is already correct, return an empty issues array. Never invent mistakes.";

var AI_SCHEMA = {
  type:"OBJECT",
  properties:{
    corrected:{type:"STRING"},
    summary_tr:{type:"STRING"},
    issues:{type:"ARRAY", items:{
      type:"OBJECT",
      properties:{
        sentence:{type:"STRING"},
        quote:{type:"STRING"},
        kind:{type:"STRING", enum:["grammar","spelling","word-choice","meaning","punctuation"]},
        fix:{type:"STRING"},
        explain_tr:{type:"STRING"}
      },
      required:["sentence","quote","kind","fix","explain_tr"]
    }}
  },
  required:["corrected","summary_tr","issues"]
};
var AI_KIND_TR = {grammar:"Gramer", spelling:"Yazım", "word-choice":"Kelime seçimi",
                  meaning:"Anlam", punctuation:"Noktalama"};

/* Gemini'yi çağır, bulguları metindeki konumlara eşle */
function aiCheck(text){
  var key = aiKey();
  if(!key) return Promise.reject(new Error("NOKEY"));
  var wait = Math.max(0, AI_MIN_GAP - (Date.now() - aiLast));
  return new Promise(function(resolve, reject){
    setTimeout(function(){
      aiLast = Date.now();
      callGeminiGenerate(key, {
        systemInstruction:{parts:[{text:AI_SYS}]},
        contents:[{parts:[{text:"Student text:\n" + text}]}],
        generationConfig:{responseMimeType:"application/json", responseSchema:AI_SCHEMA, temperature:0.2}
      }).then(function(j){
        aiCountToday(true);
        var raw = j.candidates && j.candidates[0] && j.candidates[0].content.parts[0].text;
        var out = JSON.parse(raw);
        var used = [], findings = [];
        (out.issues || []).forEach(function(is){
          if(!is.quote) return;
          /* Önce hatanın bulunduğu CÜMLEYİ konumla, sonra alıntıyı o cümlenin içinde ara.
             Yoksa "go" gibi kısa alıntılar metnin başka bir yerine eşleşiyor. */
          var base = 0, scope = text;
          if(is.sentence){
            var si = text.indexOf(is.sentence);
            if(si >= 0){ base = si; scope = is.sentence; }
          }
          var from = 0, rel;
          if(/^[^A-Za-z0-9]+$/.test(is.quote)){
            /* Alıntı yalnızca noktalama ise ("." → "?") ileri arama yanlış yere düşer:
               cümlenin SONUNDAKİ noktalamayı hedefle. */
            rel = scope.lastIndexOf(is.quote);
            if(rel < 0) rel = scope.length - is.quote.length;
          } else {
            do { rel = scope.indexOf(is.quote, from); from = rel + 1; }
            while(rel >= 0 && used.indexOf(base + rel) >= 0);
          }
          var idx = rel >= 0 ? base + rel : -1;
          if(idx < 0 && base === 0){ return; }      /* bulunamazsa atla, uydurma konum verme */
          if(idx < 0) idx = base;                   /* cümle bulundu ama alıntı bulunamadı: cümleye çapala */
          used.push(idx);
          findings.push({
            i:idx, e:idx + (rel >= 0 ? is.quote.length : Math.min(is.sentence.length, 40)),
            sev:(is.kind === "meaning" || is.kind === "grammar") ? "err" : "warn",
            ai:true, t:(AI_KIND_TR[is.kind] || "Öneri"), frag:is.quote,
            m:esc(is.explain_tr || ""), fix:is.fix || "", link:null
          });
        });
        resolve({findings:findings, corrected:out.corrected || "", summary:out.summary_tr || "",
                 usage:j.usageMetadata || null});
      }).catch(reject);
    }, wait);
  });
}

var LT_URL = "https://api.languagetool.org/v2/check";
var ltLast = 0;

var LT_CAT = {misspelling:"Yazım", grammar:"Gramer", typographical:"Noktalama", whitespace:"Boşluk",
  duplication:"Tekrar", style:"Üslup", inconsistency:"Tutarsızlık", "non-conformance":"Kullanım",
  "locale-violation":"Kullanım", uncategorized:"Öneri", other:"Öneri"};
var LT_TR = [
 [/possible spelling mistake/i, "Olası yazım hatası. Bu kelime İngilizce sözlükte yok."],
 [/usually used with a third-person/i, "Bu özne ile fiil <b>-s</b> alır (geniş zaman) veya <b>V2</b> olmalı (geçmiş)."],
 [/does not seem to match|agreement error|agreement between/i, "<b>Özne-yüklem uyumu</b> hatası: özne ile fiil uyuşmuyor."],
 [/start with an uppercase letter|sentence does not start/i, "Cümle <b>büyük harfle</b> başlamalı."],
 [/use a comma before/i, "İki bağımsız cümleyi birleştiren bağlaçtan önce <b>virgül</b> konur."],
 [/you repeated a word|word repetition/i, "<b>Kelime tekrarı</b> var."],
 [/did you mean/i, "Şunu mu demek istediniz?"],
 [/consecutive spaces|whitespace/i, "Fazladan <b>boşluk</b> var."],
 [/missing (a )?(full stop|period|punctuation)/i, "<b>Noktalama</b> eksik."],
 [/article|determiner/i, "<b>a / an / the</b> kullanımını kontrol et."],
 [/singular|plural/i, "<b>Tekil / çoğul</b> uyumunu kontrol et."],
 [/apostrophe/i, "<b>Kesme işareti</b> kullanımı."],
 [/preposition/i, "<b>Edat</b> kullanımını kontrol et."],
 [/tense/i, "<b>Zaman</b> kullanımını kontrol et."]
];
function ltTranslate(msg){
  for(var i=0;i<LT_TR.length;i++) if(LT_TR[i][0].test(msg)) return LT_TR[i][1];
  return "";
}
function ltCheck(text){
  var wait = Math.max(0, 2500 - (Date.now() - ltLast));
  return new Promise(function(resolve, reject){
    setTimeout(function(){
      ltLast = Date.now();
      var body = "text=" + encodeURIComponent(text) + "&language=en-US&level=default";
      fetch(LT_URL, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:body})
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          resolve((j.matches||[]).filter(function(m){
            var frag = text.substr(m.offset, m.length);
            var it = (m.rule && m.rule.issueType) || "other";
            if(it !== "misspelling") return true;
            /* Büyük harfle başlıyor ve cümle başında değilse → özel isim, dokunma */
            if(/^[A-Z]/.test(frag)){
              var before = text.slice(0, m.offset).replace(/\s+$/, "");
              if(before && !/[.!?:;"]$/.test(before)) return false;
            }
            /* Tek kelimeyi ikiye bölen öneriler (Bodrum → Bo drum) neredeyse hep yanlıştır */
            var reps = (m.replacements||[]).map(function(x){ return x.value; });
            if(!/\s/.test(frag) && reps.length && reps.every(function(v){ return /\s/.test(v); })) return false;
            return true;
          }).map(function(m){
            var it = (m.rule && m.rule.issueType) || "other";
            var cat = LT_CAT[it] || "Öneri";
            var tr = ltTranslate(m.message);
            var sev = (it === "misspelling" || it === "grammar") ? "err"
                    : (it === "style" || it === "uncategorized") ? "tip" : "warn";
            return {
              i:m.offset, e:m.offset + m.length, sev:sev, online:true,
              t:cat, frag:text.substr(m.offset, m.length),
              m:(tr ? tr + '<br><span style="color:var(--muted);font-size:13px">' + esc(m.message) + '</span>' : esc(m.message)),
              fix:(m.replacements||[]).slice(0,3).map(function(x){return x.value;}).join("  /  "),
              link:null
            };
          }));
        })
        .catch(reject);
    }, wait);
  });

function runCheck(text, task){
  var box = el("result");
  if(!text.trim()){ box.innerHTML = '<div class="note warn"><b class="lbl">Boş</b>Önce birkaç cümle yaz, sonra kontrol et.</div>'; return; }
  var r = checkText(text);
  render(r, null);

  var btn = el("checkBtn");
  var plainT = text.replace(/’/g,"'");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Yapay zekâ denetliyor...';

  /* Dış bulguları kendi bulgularımla birleştir (çakışanlarda benimki öncelikli) */
  function merge(ext){
    var mine = r.findings.filter(function(f){ return f.i >= 0; });
    var extra = [];
    ext.forEach(function(o){
      var hit = mine.filter(function(f){ return o.i < f.e && f.i < o.e; })[0];
      if(hit){
        if(o.fix && !hit.fix) hit.fix = o.fix;
        else if(o.fix && hit.fix && hit.fix.toLowerCase() !== o.fix.toLowerCase()) hit.alt = o.fix;
        return;
      }
      extra.push(o);
    });
    var m = {findings: r.findings.concat(extra), words:r.words, sents:r.sents};
    m.findings.sort(function(a,b){ return (a.i<0?1e9:a.i) - (b.i<0?1e9:b.i); });
    return {res:m, n:extra.length};
  }
  function done(){ btn.disabled = false; btn.textContent = "✓ Kontrol Et"; }

  aiCheck(plainT).then(function(ai){
    var mg = merge(ai.findings);
    render(mg.res, {src:"ai", n:mg.n, corrected:ai.corrected, summary:ai.summary, usage:ai.usage});
    done();
  }).catch(function(err){
    /* Yapay zekâ kullanılamıyorsa LanguageTool'a düş */
    var why = err && err.code === 429 ? "quota"
            : err && (err.code === 401 || err.code === 403) ? "key"
            : err && err.message === "NOKEY" ? "nokey" : "net";
    btn.innerHTML = '<span class="spin"></span> LanguageTool deneniyor...';
    ltCheck(plainT).then(function(lt){
      var mg = merge(lt);
      render(mg.res, {src:"lt", n:mg.n, aiFail:why, msg:String(err && err.message || err)});
    }).catch(function(e2){
      render(r, {src:"none", aiFail:why, msg:String(err && err.message || err)});
    }).then(done);
  });

  function render(res, net){
    box.innerHTML = buildReport(res, net, text);
    applyGloss(box);
    var cb = el("copyFixed");
    if(cb) cb.onclick = function(){
      var t = el("fixedText").textContent;
      try{
        navigator.clipboard.writeText(t).then(function(){ cb.textContent = "✓ Kopyalandı"; },
          function(){ fallbackCopy(t, cb); });
      }catch(e){ fallbackCopy(t, cb); }
    };
    if(!net) box.scrollIntoView({behavior:"smooth", block:"start"});
  }
  function fallbackCopy(t, cb){
    var ta2 = document.createElement("textarea");
    ta2.value = t; ta2.style.position = "fixed"; ta2.style.opacity = "0";
    document.body.appendChild(ta2); ta2.select();
    try{ document.execCommand("copy"); cb.textContent = "✓ Kopyalandı"; }
    catch(e){ cb.textContent = "Kopyalanamadı — elle seç"; }
    document.body.removeChild(ta2);
  }
}

/* Bir bulgunun otomatik uygulanabilir tek bir düzeltmesi var mı? */
function cleanRep(f){
  if(f.i < 0 || !f.fix) return null;
  var s = String(f.fix).split("  /  ")[0].split(" / ")[0].trim();
  if(/[(){}]|ya da|veya|…|yerine/.test(s)) return null;
  if(!s || s.length > 40) return null;
  /* Tek kelimeyi ikiye bölen düzeltmeyi otomatik uygulama */
  if(f.frag && !/\s/.test(f.frag) && /\s/.test(s)) return null;
  return s;
}
/* Düzeltmeleri metne uygula */
function applyFixes(text, findings){
  var list = findings.filter(function(f){ return f.i >= 0 && cleanRep(f); })
                     .sort(function(a,b){ return a.i - b.i; });
  var out = "", last = 0, n = 0;
  list.forEach(function(f){
    if(f.i < last) return;
    var rep = cleanRep(f);
    if(text.slice(f.i, f.e) === rep) return;
    out += esc(text.slice(last, f.i)) + '<mark class="mk fixd">' + esc(rep) + '</mark>';
    last = f.e; n++;
  });
  return {html: out + esc(text.slice(last)), n: n};
}

    nokey: "Gemini anahtarı tanımlı değil. Yukarıdaki 'Gemini API Anahtarı' bölümünden anahtarınızı ekleyip kaydedebilirsiniz.",

         (net.usage ? ' <span style="color:var(--muted)">· '+net.usage.totalTokenCount+' token · bu tarayıcıdan bugün '+aiCountToday(false)+' denetim</span>' : '')+

         (AIFAIL[net.aiFail] || AIFAIL.net)+' Aşağıdakiler tamamen cihazında çalışan kural denetiminin sonuçlarıdır.'+
         '<br><span style="font-size:12.5px;color:var(--muted)">'+esc(net.msg||"")+'</span></div>';

         'Ama bu <u>yazın kusursuz</u> demek değil: denetleyici anlamı, kelime seçimini ve cümle kuruluşunu değerlendiremez. '+
         'Aşağıdaki kontrol listesini kendin gözden geçir.</div>';
  } else {
    h += '<h3 style="margin:20px 0 10px;font-size:18px;font-weight:800;">Bulgular</h3>';

      var lbl = f.sev==="err" ? "Hata" : f.sev==="warn" ? "Uyarı" : "İpucu";

           'burada uygulanmadı; onları kendin düzelt.</p>'+

           '<div class="btn-row"><button class="btn" id="copyFixed">Düzeltilmiş metni kopyala</button></div>';

  r.sents.forEach(function(s, i){
    var n = r.findings.filter(function(f){ return f.i >= s.i && f.i < s.i + s.txt.length; }).length;
    h += '<div class="sent '+(n?"bad":"good")+'"><span class="sn">'+(n?n:"✓")+'</span>'+
         '<span style="flex:1">'+esc(s.txt.trim())+'</span><span class="sw">'+s.w+' kel.</span></div>';
  });
  h += '</div>';
  return h;
}

function examBuild(){
  var qs = [];
  T.forEach(function(t){
    if(!t.q || !t.q.length) return;
    var pick = t.q[Math.floor(Math.random() * t.q.length)];
    qs.push({tid:t.id, title:t.title, node:t.node, q:pick});
  });
  for(var i = qs.length - 1; i > 0; i--){          /* karıştır */
    var j = Math.floor(Math.random() * (i + 1)), tmp = qs[i]; qs[i] = qs[j]; qs[j] = tmp;
  }
  return {qs:qs, ans:qs.map(function(){ return null; }), idx:0, done:false};
}

function showExam(restart){
  current = null; closeNav();
  if(restart || !EX) EX = examBuild();
  fab.style.display = "none";
  buildNav(el("search").value);
  EX.done ? examResult() : examQuestion();
}

function examQuestion(){
  var n = EX.qs.length, cur = EX.qs[EX.idx], answered = 0;
  EX.ans.forEach(function(a){ if(a !== null) answered++; });

  var h = '<div class="crumb">Genel Değerlendirme</div>' +
    '<div class="ex-head"><div class="ln"><span>Soru <b>' + (EX.idx + 1) + '</b> / ' + n + '</span>' +
    '<span>' + answered + ' soru cevaplandı</span></div>' +
    '<div class="prog-bar"><div class="prog-fill" style="width:' + ((EX.idx + 1) / n * 100) + '%"></div></div></div>';

  h += '<div class="q"><div class="ex-topic">' + esc(cur.title) + '</div>' +
       '<div class="q-text">' + esc(cur.q.q).replace(/___/g, '<span class="k">_____</span>') + '</div>';
  cur.q.o.forEach(function(o, j){
    h += '<button class="opt' + (EX.ans[EX.idx] === j ? " sel" : "") + '" data-pick="' + j + '">' +
         String.fromCharCode(65 + j) + ') ' + esc(o) + '</button>';
  });
  h += '</div>';

  h += '<div class="ex-nav">';
  if(EX.idx > 0) h += '<button class="btn" data-exnav="prev">‹ Geri</button>';
  h += EX.idx < n - 1
      ? '<button class="btn primary" data-exnav="next">Sonraki ›</button>'
      : '<button class="btn primary" data-exnav="finish">Sınavı Bitir</button>';
  h += '</div>';
  if(EX.idx === n - 1 && answered < n)
    h += '<div class="note warn" style="margin-top:12px"><b class="lbl">Dikkat</b>' +
         (n - answered) + ' soru boş. Boş sorular yanlış sayılır.</div>';

  main.innerHTML = h;
  window.scrollTo(0, 0);
  applyGloss(main);

  main.querySelectorAll("[data-pick]").forEach(function(b){
    b.onclick = function(){
      EX.ans[EX.idx] = +this.getAttribute("data-pick");
      /* sınav modunda doğru/yanlış gösterilmez — sadece seçim işaretlenir */
      main.querySelectorAll("[data-pick]").forEach(function(x){ x.classList.remove("sel"); });
      this.classList.add("sel");
      var cnt = 0; EX.ans.forEach(function(a){ if(a !== null) cnt++; });
      var ln = main.querySelector(".ex-head .ln span:last-child");
      if(ln) ln.textContent = cnt + " soru cevaplandı";
      if(EX.idx < EX.qs.length - 1) setTimeout(function(){ EX.idx++; examQuestion(); }, 260);
    };
  });
  main.querySelectorAll("[data-exnav]").forEach(function(b){
    b.onclick = function(){
      var a = this.getAttribute("data-exnav");
      if(a === "prev" && EX.idx > 0) EX.idx--;
      else if(a === "next" && EX.idx < EX.qs.length - 1) EX.idx++;
      else if(a === "finish"){ EX.done = true; examResult(); return; }
      examQuestion();
    };
  });
}

function examResult(){
  var n = EX.qs.length, right = 0, byNode = {}, wrong = [];
  EX.qs.forEach(function(item, i){
    var ok = EX.ans[i] === item.q.a;
    if(!byNode[item.node]) byNode[item.node] = {r:0, t:0};
    byNode[item.node].t++;
    if(ok){ right++; byNode[item.node].r++; }
    else wrong.push({item:item, given:EX.ans[i]});
  });
  var pct = Math.round(right / n * 100);
  var best = 0;
  try{ best = +(localStorage.getItem(EX_BEST) || 0); }catch(e){}
  if(pct > best){ best = pct; try{ localStorage.setItem(EX_BEST, String(pct)); }catch(e){} }

  var verdict = pct >= 85 ? {t:"Çok iyi", m:"A2 konularına hâkimsin. Yazma Atölyesi'nde pratiğe geçebilirsin.", c:"tip"}
              : pct >= 65 ? {t:"İyi", m:"Temeller sağlam. Aşağıdaki konuları tekrar edince tamamlanır.", c:"tip"}
              : pct >= 45 ? {t:"Orta", m:"Bazı konularda boşluk var. Aşağıdaki listeyi sırayla çalış.", c:"warn"}
                          : {t:"Tekrar gerekli", m:"Konuları baştan gözden geçirmen faydalı olur.", c:"err"};

  var h = '<div class="crumb">Genel Değerlendirme · Sonuç</div>' +
    '<div class="score"><div class="res-big">' + right + ' / ' + n + '</div>' +
    '<div class="res-pct">%' + pct + ' doğru · en iyi skorun: %' + best + '</div></div>';

  h += '<div class="note ' + verdict.c + '"><b class="lbl">' + verdict.t + '</b>' + verdict.m + '</div>';

  h += '<h3 style="margin:22px 0 10px;font-size:18px;font-weight:800;">Düğüm Bazlı Sonuç</h3><div class="card">';
  NODES.forEach(function(nd){
    var b = byNode[nd.n]; if(!b) return;
    h += '<div class="nrow"><span class="nn"><b>' + nd.n + '.</b> ' + esc(nd.title) + '</span>' +
         '<span class="nb"><i style="width:' + (b.r / b.t * 100) + '%"></i></span>' +
         '<span class="ns">' + b.r + '/' + b.t + '</span></div>';
  });
  h += '</div>';

  if(wrong.length){
    h += '<h3 style="margin:22px 0 10px;font-size:18px;font-weight:800;">Tekrar Etmen Gereken Konular</h3>';
    wrong.forEach(function(w){
      var q = w.item.q;
      h += '<div class="wrong"><div class="wq">' + esc(q.q).replace(/___/g, "_____") + '</div>' +
           '<div class="wa">' +
           (w.given === null ? "<s>Boş bıraktın</s>" : "<s>" + esc(q.o[w.given]) + "</s>") +
           ' → <b>' + esc(q.o[q.a]) + '</b></div>' +
           '<div class="wa" style="color:var(--muted)">' + q.e + '</div>' +
           '<div class="fix" style="margin-top:6px"><span class="chip link" data-go="' + w.item.tid + '">' +
           esc(w.item.title) + ' konusunu aç ›</span></div></div>';
    });
  } else {
    h += '<div class="note tip"><b class="lbl">Tam puan</b>24 konunun hepsinde doğru cevap verdin.</div>';
  }

  h += '<div class="btn-row" style="margin-top:18px">' +
       '<button class="btn primary" data-exnav="again">Yeni Sınav</button>' +
       '<button class="btn" data-go="__home">Ana Sayfa</button></div>';

  main.innerHTML = h;
  window.scrollTo(0, 0);
  applyGloss(main);
  var ag = main.querySelector('[data-exnav="again"]');
  if(ag) ag.onclick = function(){ showExam(true); };
}

/* =====================================================================
   KELİME HAZİNESİ
   Kaynak: Language/ klasöründeki PDF'lerden çıkarıldı
   (600 temel isim + türemiş biçimleri, YÖKDİL listelerinden zengin girişler).
   VOC  : [kelime, türkçe, tür, [türemiş biçimler]]
   VOCX : kelime -> {c:eş dizimler, x:örnek cümleler, s:eş anlamlılar, d:tanımlar}
   ===================================================================== */
var POSN = {i:"isim", f:"fiil", s:"sıfat", z:"zarf", p:"phrasal verb", m:"modal",
            e:"edat", b:"bağlaç", r:"zamir", u:"ünlem", d:"deyim"};
var POSSHORT = {i:"isim", f:"fiil", s:"sıfat", z:"zarf", p:"p.verb", m:"modal",
                e:"edat", b:"bağlaç", r:"zamir", u:"ünlem", d:"deyim"};

var VS = {tab:"list", q:"", pos:"", shown:80, cards:null, ci:0, flip:false, quiz:null};
var VL = {};
try{ VL = JSON.parse(localStorage.getItem("a2gram_vocab_learned") || "{}") || {}; }catch(e){ VL = {}; }
function vlSave(){ try{ localStorage.setItem("a2gram_vocab_learned", JSON.stringify(VL)); }catch(e){} }
function vlCount(){ var n = 0; for(var k in VL) if(VL[k]) n++; return n; }

/* Türkçe duyarlı küçük harf (İ/I sorunu) */
function trLower(s){ return String(s).replace(/İ/g, "i").replace(/I/g, "ı").toLowerCase(); }

function vocFilter(){
  var q = trLower(VS.q.trim()), pos = VS.pos;
  return VOC.filter(function(r){
    if(pos && r[2] !== pos) return false;
    if(!q) return true;
    if(trLower(r[0]).indexOf(q) >= 0 || trLower(r[1]).indexOf(q) >= 0) return true;
    if(r[3]) for(var i = 0; i < r[3].length; i++)
      if(trLower(r[3][i][0]).indexOf(q) >= 0 || trLower(r[3][i][1]).indexOf(q) >= 0) return true;
    return false;
  });
}
function vocTotal(){
  var n = VOC.length;
  VOC.forEach(function(r){ if(r[3]) n += r[3].length; });
  return n;
}

/* ---------- ANA EKRAN ---------- */
function showVocab(tab){
  current = null; closeNav();
  if(tab) VS.tab = tab;
  fab.style.display = "none";
  var learned = vlCount();
  var h = '<div class="crumb">Kelime Çalışması</div>' +
    '<h1 class="topic-title">📚 Kelime Hazinesi</h1>' +
    '<p class="topic-sub">' + VOC.length + ' ana kelime · ' + vocTotal() + ' toplam biçim · ' +
    Object.keys(VOCX).length + ' kelimede örnek cümle</p>';

  h += '<div class="vprog"><div class="ln"><span>Öğrendiklerin</span><b>' + learned + ' / ' + VOC.length + '</b></div>' +
       '<div class="prog-bar"><div class="prog-fill" style="width:' + (learned / VOC.length * 100) + '%"></div></div></div>';

  h += '<div class="vtabs">' +
       ["list:Liste", "cards:Kartlar", "quiz:Test"].map(function(t){
         var k = t.split(":")[0];
         return '<button class="vtab' + (VS.tab === k ? " on" : "") + '" data-vtab="' + k + '">' + t.split(":")[1] + '</button>';
       }).join("") + '</div>';

  h += '<div id="vBody"></div>';
  main.innerHTML = h;
  window.scrollTo(0, 0);
  buildNav(el("search").value);
  main.querySelectorAll("[data-vtab]").forEach(function(b){
    b.onclick = function(){ VS.tab = this.getAttribute("data-vtab"); VS.shown = 80; showVocab(); };
  });
  if(VS.tab === "list") vocList();
  else if(VS.tab === "cards") vocCards(true);
  else vocQuiz(true);
}

/* ---------- LİSTE ---------- */
function vocList(){
  var box = el("vBody");
  var h = '<div class="vsearch"><input id="vq" type="search" placeholder="Kelime veya Türkçe anlam ara…" value="' +
          esc(VS.q) + '" autocomplete="off"></div>';
  var cnt = {};
  VOC.forEach(function(r){ cnt[r[2]] = (cnt[r[2]] || 0) + 1; });
  h += '<div class="vchips">' +
       '<button class="vchip' + (VS.pos === "" ? " on" : "") + '" data-vpos="">Hepsi <i>' + VOC.length + '</i></button>' +
       ["i", "f", "s", "z", "p", "m", "e", "b", "d"].filter(function(p){ return cnt[p]; }).map(function(p){
         return '<button class="vchip' + (VS.pos === p ? " on" : "") + '" data-vpos="' + p + '">' +
                POSSHORT[p] + ' <i>' + cnt[p] + '</i></button>';
       }).join("") + '</div>';
  h += '<div id="vList"></div>';
  box.innerHTML = h;

  el("vq").oninput = function(){ VS.q = this.value; VS.shown = 80; paint(); };
  box.querySelectorAll("[data-vpos]").forEach(function(b){
    b.onclick = function(){ VS.pos = this.getAttribute("data-vpos"); VS.shown = 80; vocList(); };
  });

  function paint(){
    var rows = vocFilter(), lst = el("vList");
    if(!rows.length){ lst.innerHTML = '<div class="empty">Eşleşen kelime yok.</div>'; return; }
    var part = rows.slice(0, VS.shown);
    var s = '<div class="vcount">' + rows.length + ' kelime</div>';
    var letter = "";
    part.forEach(function(r){
      var L = r[0].charAt(0).toUpperCase();
      if(L !== letter){ letter = L; s += '<div class="valpha">' + L + '</div>'; }
      s += '<button class="vrow' + (VL[r[0]] ? " done" : "") + '" data-vw="' + esc(r[0]) + '">' +
           '<span class="vw">' + esc(r[0]) + '</span>' +
           '<span class="vpos p' + r[2] + '">' + POSSHORT[r[2]] + '</span>' +
           '<span class="vtr">' + esc(r[1]) + '</span>' +
           (VOCX[r[0].toLowerCase()] ? '<span class="vstar">●</span>' : '') +
           '</button>';
    });
    if(rows.length > VS.shown)
      s += '<button class="btn full" style="margin-top:12px" id="vMore">Daha fazla göster (' +
           (rows.length - VS.shown) + ' kaldı)</button>';
    lst.innerHTML = s;
    lst.querySelectorAll("[data-vw]").forEach(function(b){
      b.onclick = function(){ vocDetail(this.getAttribute("data-vw")); };
    });
    var m = el("vMore");
    if(m) m.onclick = function(){ VS.shown += 120; paint(); };
  }
  paint();
}

/* ---------- DETAY ---------- */
function vocDetail(w){
  var row = null;
  VOC.forEach(function(r){ if(r[0] === w) row = r; });
  if(!row) return;
  var x = VOCX[w.toLowerCase()];
  var h = '<button class="btn" id="vBack" style="margin-bottom:14px">‹ Listeye dön</button>';
  h += '<div class="vhead"><div class="vhw gl">' + esc(row[0]) + '</div>' +
       '<span class="vpos p' + row[2] + '">' + POSN[row[2]] + '</span>' +
       '<div class="vhtr">' + esc(row[1]) + '</div></div>';
  h += '<button class="btn ' + (VL[w] ? "ok" : "primary") + ' full" id="vLearn">' +
       (VL[w] ? "✓ Öğrendim (kaldır)" : "Öğrendim olarak işaretle") + '</button>';

  if(row[3] && row[3].length){
    h += '<h3 class="vh3">Türemiş Biçimler</h3><div class="card">';
    row[3].forEach(function(f){
      h += '<div class="vfrow"><span class="vw gl">' + esc(f[0]) + '</span>' +
           '<span class="vpos p' + f[2] + '">' + POSSHORT[f[2]] + '</span>' +
           '<span class="vtr">' + esc(f[1]) + '</span></div>';
    });
    h += '</div>';
  }
  if(x && x.d && x.d.length > 1){
    h += '<h3 class="vh3">Diğer Anlamlar</h3><div class="card">';
    x.d.forEach(function(d){
      h += '<div class="vfrow"><span class="vw gl">' + esc(d[0]) + '</span>' +
           '<span class="vtr">' + esc(d[2]) + '</span></div>';
    });
    h += '</div>';
  }
  if(x && x.c && x.c.length){
    h += '<h3 class="vh3">Eş Dizimler <span class="vsub">birlikte kullanılan kalıplar</span></h3><div class="card">';
    x.c.forEach(function(c){
      h += '<div class="vfrow"><span class="vw gl">' + esc(c[0]) + '</span>' +
           '<span class="vtr">' + esc(c[1]) + '</span></div>';
    });
    h += '</div>';
  }
  if(x && x.x && x.x.length){
    h += '<h3 class="vh3">Örnek Cümleler</h3><div class="card">';
    x.x.forEach(function(e){
      h += '<div class="ex"><div class="en gl">' + esc(e[0]) + '</div>' +
           (e[1] ? '<div class="tr">' + esc(e[1]) + '</div>' : '') + '</div>';
    });
    h += '</div>';
  }
  if(x && x.s)
    h += '<h3 class="vh3">Eş Anlamlılar</h3><div class="card"><p class="gl" style="margin:0">' + esc(x.s) + '</p></div>';

  el("vBody").innerHTML = h;
  window.scrollTo(0, 0);
  applyGloss(el("vBody"));
  el("vBack").onclick = function(){ vocList(); };
  el("vLearn").onclick = function(){ VL[w] = !VL[w]; vlSave(); vocDetail(w); };
}

/* ---------- KARTLAR ---------- */
function vocCards(reset){
  if(reset || !VS.cards || !VS.cards.length){
    var pool = vocFilter();
    var un = pool.filter(function(r){ return !VL[r[0]]; });
    var use = un.length ? un : pool;
    VS.cards = use.slice();
    for(var i = VS.cards.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), t = VS.cards[i]; VS.cards[i] = VS.cards[j]; VS.cards[j] = t;
    }
    VS.cards = VS.cards.slice(0, 40);
    VS.ci = 0; VS.flip = false;
  }
  var box = el("vBody");
  if(!VS.cards.length){ box.innerHTML = '<div class="empty">Kart yok.</div>'; return; }
  if(VS.ci >= VS.cards.length){
    box.innerHTML = '<div class="score"><div class="res-big">Bitti</div>' +
      '<div class="res-pct">' + VS.cards.length + ' kart çalışıldı · toplam öğrenilen: ' + vlCount() + '</div></div>' +
      '<button class="btn primary full" id="vAgain">Yeni Deste</button>';
    el("vAgain").onclick = function(){ vocCards(true); };
    return;
  }
  var r = VS.cards[VS.ci];
  var x = VOCX[r[0].toLowerCase()];
  var h = '<div class="vcprog">Kart ' + (VS.ci + 1) + ' / ' + VS.cards.length + '</div>';
  h += '<div class="fcard" id="vCard">';
  h += '<div class="fw gl">' + esc(r[0]) + '</div>';
  h += '<div class="fpos"><span class="vpos p' + r[2] + '">' + POSN[r[2]] + '</span></div>';
  if(VS.flip){
    h += '<div class="ftr">' + esc(r[1]) + '</div>';
    if(r[3] && r[3].length)
      h += '<div class="ffs">' + r[3].slice(0, 3).map(function(f){
             return esc(f[0]) + ' <i>' + esc(f[1]) + '</i>'; }).join(" · ") + '</div>';
    if(x && x.x && x.x.length)
      h += '<div class="fex gl">' + esc(x.x[0][0]) + '<br><i>' + esc(x.x[0][1]) + '</i></div>';
  } else {
    h += '<div class="fhint">Anlamı görmek için dokun</div>';
  }
  h += '</div>';
  h += '<div class="ex-nav">' +
       (VS.flip
         ? '<button class="btn" data-vc="again">Tekrar et</button><button class="btn ok" data-vc="know">✓ Biliyorum</button>'
         : '<button class="btn primary full" data-vc="flip">Çevir</button>') +
       '</div>';
  box.innerHTML = h;
  window.scrollTo(0, 0);
  applyGloss(box);
  el("vCard").onclick = function(){ VS.flip = !VS.flip; vocCards(); };
  box.querySelectorAll("[data-vc]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var a = this.getAttribute("data-vc");
      if(a === "flip"){ VS.flip = true; }
      else {
        if(a === "know"){ VL[r[0]] = 1; vlSave(); }
        VS.ci++; VS.flip = false;
      }
      vocCards();
    };
  });
}

/* ---------- TEST ---------- */
function vocQuiz(reset){
  var box = el("vBody");
  if(reset || !VS.quiz){
    var pool = vocFilter().filter(function(r){ return r[1] && r[1].length > 1; });
    if(pool.length < 8){ box.innerHTML = '<div class="empty">Test için yeterli kelime yok.</div>'; return; }
    var qs = [], used = {};
    for(var i = 0; i < 20 && i < pool.length; i++){
      var r, guard0 = 0;
      do { r = pool[Math.floor(Math.random() * pool.length)]; } while(used[r[0]] && guard0++ < 300);
      used[r[0]] = 1;
      var opts = [r[1]], guard = 0;
      while(opts.length < 4 && guard++ < 300){
        var o = pool[Math.floor(Math.random() * pool.length)][1];
        if(opts.indexOf(o) < 0) opts.push(o);
      }
      for(var k = opts.length - 1; k > 0; k--){
        var j = Math.floor(Math.random() * (k + 1)), t = opts[k]; opts[k] = opts[j]; opts[j] = t;
      }
      qs.push({w:r[0], pos:r[2], o:opts, a:opts.indexOf(r[1])});
    }
    VS.quiz = {qs:qs, i:0, right:0, ans:null};
  }
  var Q = VS.quiz;
  if(Q.i >= Q.qs.length){
    var pct = Math.round(Q.right / Q.qs.length * 100);
    box.innerHTML = '<div class="score"><div class="res-big">' + Q.right + ' / ' + Q.qs.length + '</div>' +
      '<div class="res-pct">%' + pct + ' doğru</div></div>' +
      '<button class="btn primary full" id="vqAgain">Yeni Test</button>';
    el("vqAgain").onclick = function(){ vocQuiz(true); };
    return;
  }
  var q = Q.qs[Q.i];
  var h = '<div class="vcprog">Soru ' + (Q.i + 1) + ' / ' + Q.qs.length + ' · doğru: ' + Q.right + '</div>';
  h += '<div class="q"><div class="q-text" style="text-align:center;font-size:24px">' + esc(q.w) +
       ' <span class="vpos p' + q.pos + '">' + POSSHORT[q.pos] + '</span></div>';
  q.o.forEach(function(o, j){
    var cls = "opt";
    if(Q.ans !== null){
      if(j === q.a) cls += " correct";
      else if(j === Q.ans) cls += " wrong";
    }
    h += '<button class="' + cls + '" data-vqo="' + j + '"' + (Q.ans !== null ? " disabled" : "") + '>' + esc(o) + '</button>';
  });
  h += '</div>';
  if(Q.ans !== null)
    h += '<button class="btn primary full" id="vqNext">' + (Q.i === Q.qs.length - 1 ? "Sonucu Gör" : "Sonraki ›") + '</button>';
  box.innerHTML = h;
  window.scrollTo(0, 0);
  box.querySelectorAll("[data-vqo]").forEach(function(b){
    b.onclick = function(){
      if(Q.ans !== null) return;
      Q.ans = +this.getAttribute("data-vqo");
      if(Q.ans === q.a){ Q.right++; VL[q.w] = 1; vlSave(); }
      vocQuiz();
    };
  });
  var nx = el("vqNext");
  if(nx) nx.onclick = function(){ Q.i++; Q.ans = null; vocQuiz(); };
}

/* ---------- Yönlendirme ---------- */
function go(id){
  if(id === "__home") showHome();
  else if(id === "__write") showWriting();
  else if(id === "__exam") showExam(true);
  else if(id === "__listen") showListenHub();
  else if(id === "__vocab") showVocab("list");
  else showTopic(id);
}
document.addEventListener("click", function(e){
  var yt = e.target.closest("[data-yturl]");
  if(yt){
    e.preventDefault();
    openExternal(yt.getAttribute("data-yturl") || yt.getAttribute("href"));
    return;
  }
  var b = e.target.closest("[data-go]");
  if(b){ go(b.getAttribute("data-go")); }
});
el("homeBtn").onclick = showHome;
el("bigQuizBtn").onclick = showBigQuiz;
el("examBtn").onclick = function(){ showExam(true); };
el("listenBtn").onclick = showListenHub;
el("vocabBtn").onclick = function(){ showVocab("list"); };
el("writeBtn").onclick = function(){ showWriting(); };
el("search").addEventListener("input", function(){ buildNav(this.value); });
window.addEventListener("resize", function(){
  if(window.innerWidth > 900){
    closeNav();
    if(fab) fab.style.display = "none";
  } else if(current && fab){
    fab.style.display = "inline-flex";
  }
});

/* ---------- Başlat ---------- */
buildNav("");
showHome();
</script>
